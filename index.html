/* ---------- MEGAVERKS FORMULA WORKBOOK ---------- */
/* MEGAVERKS formula workbook — built with SheetJS cell objects.
   Amount = Qty*Rate, subtotals = SUM, system totals, GST, grand total — all live formulas.
   Exposed as mvExcel(XLSX, model, S, PROFILE) so it runs identically in the browser and here. */
function mvExcel(XLSX, M, S, PROFILE){
  const P = PROFILE;
  const ws = {};
  let r = 0;
  const A = (row,col)=> XLSX.utils.encode_cell({r:row,c:col});
  const NCOL = 10;
  const merges = [];
  const show202 = !!(S.print && S.print.show202);
  const COLS = show202?11:10;

  const F = rgb=>({rgb:rgb});
  const brandBg='1F4E79', brandFg='FFFFFF', bandBg='DDE7F0', headBg='EFF2F3', line='9AA4AB';
  const BORD = {top:{style:'thin',color:F(line)},bottom:{style:'thin',color:F(line)},left:{style:'thin',color:F(line)},right:{style:'thin',color:F(line)}};
  const st=(o)=>Object.assign({border:BORD},o);
  const merge=(row,c1,c2)=>merges.push({s:{r:row,c:c1},e:{r:row,c:c2}});
  ws['!rows']=ws['!rows']||[];

  const put=(row,col,v,ss)=>{ ws[A(row,col)] = Object.assign({t:'s',v:String(v)}, {s:st(ss||{})}); };
  const num=(row,col,v,ss,z)=>{ ws[A(row,col)] = Object.assign({t:'n',v:v},{s:st(Object.assign({z:z||'#,##0'},ss||{}))}); };
  const formula=(row,col,f,z,ss)=>{ ws[A(row,col)] = Object.assign({t:'n',f:f},{s:st(Object.assign({z:z||'#,##0',bold:true},ss||{}))}); };
  const span=(row,label,ss)=>{ put(row,0,label,ss); merge(row,0,COLS-1); };

  /* brand band — same as the PDF */
  put(r,0,P.brandTop,{bold:true,sz:22,color:F(brandFg),fill:{fgColor:F(brandBg)},alignment:{horizontal:'center'}}); merge(r,0,COLS-1); ws['!rows'][r]={hpt:30}; r++;
  put(r,0,P.brandSub,{bold:true,sz:12,color:F(brandFg),fill:{fgColor:F(brandBg)},alignment:{horizontal:'center'}}); merge(r,0,COLS-1); r++;
  put(r,0,P.tagline,{sz:9,color:F(brandFg),fill:{fgColor:F(brandBg)},alignment:{horizontal:'center'}}); merge(r,0,COLS-1); r++;
  put(r,0,`Phone: ${P.phone}  |  Email: ${P.email}  |  GSTIN: ${P.gstin}  |  ${P.place}`,{sz:9,color:F('D6DEE6'),fill:{fgColor:F(brandBg)},alignment:{horizontal:'center'}}); merge(r,0,COLS-1); r++;
  r++;

  /* title */
  span(r,`${DOC_MODE==='proforma'?'PROFORMA INVOICE':'QUOTATION'}${N(S.meta.rev)?' (REV '+S.meta.rev+')':''}`,{bold:true,sz:14,alignment:{horizontal:'center'}}); r++;

  /* meta grid */
  const meta=[
    ['Company Name',S.cust.company,'Project Name',S.cust.site],
    ['Contact Person',S.cust.name,'Site Address',(S.cust.address||'').replace(/\n/g,', ')],
    ['Phone',S.cust.phone,'Project Ref',S.cust.site],
    ['Email',S.cust.email,'Prepared By',S.meta.coName||P.signName],
    ['Ref No',DOC_MODE==='proforma'?proformaNo():S.meta.quoteNo,'Date',`${S.meta.date}  ·  Valid ${S.meta.validity} days`],
  ];
  if(S.meta.poNo) meta.push(['Customer PO No',S.meta.poNo,'PO Date',S.meta.date]);
  meta.forEach(row=>{
    put(r,0,row[0],{bold:true,sz:9,fill:{fgColor:F(headBg)}});
    put(r,1,row[1]||'',{sz:10}); merge(r,1,3);
    put(r,4,row[2],{bold:true,sz:9,fill:{fgColor:F(headBg)}});
    put(r,5,row[3]||'',{sz:10}); merge(r,5,COLS-1);
    r++;
  });
  r++;

  const HEAD=['Sl','Category / Description','Specifications & Make','L','B','H','Unit','Qty','Unit Price',`Amount${show202?' (SS 304)':''}`];
  const headRow=()=>{ HEAD.forEach((h,ci)=>put(r,ci,h,{bold:true,sz:9,fill:{fgColor:F(headBg)},alignment:{horizontal:'center',wrapText:true}}));
    if(show202) put(r,10,'SS 202 Total',{bold:true,sz:9,fill:{fgColor:F(headBg)},alignment:{horizontal:'center',wrapText:true}}); r++; };
  const subtotalCells=[];

  function writeSection(sec){
    span(r,`${sec.code}. ${sec.title}`,{bold:true,sz:10,color:F('1F4E79'),fill:{fgColor:F(bandBg)}}); r++;
    headRow();
    const first=r;
    sec.rows.forEach(row=>{
      num(r,0,N(row.sl),{sz:9,alignment:{horizontal:'center'}},'0');
      put(r,1,row.cat,{sz:10,bold:true,alignment:{wrapText:true,vertical:'top'}});
      put(r,2,row.spec,{sz:9,alignment:{wrapText:true,vertical:'top'}});
      put(r,3,String(row.L),{sz:9,alignment:{horizontal:'center'}});
      put(r,4,String(row.B),{sz:9,alignment:{horizontal:'center'}});
      put(r,5,String(row.H),{sz:9,alignment:{horizontal:'center'}});
      put(r,6,row.unit,{sz:9,alignment:{horizontal:'center'}});
      num(r,7,N(row.qty),{sz:10,alignment:{horizontal:'right'}},'#,##0.00');
      num(r,8,row.rate,{sz:10,alignment:{horizontal:'right'}},'#,##0.00');
      formula(r,9,`ROUND(H${r+1}*I${r+1},0)`,'#,##0',{alignment:{horizontal:'right'}});
      if(show202) formula(r,10,`ROUND(H${r+1}*${Math.max(0,N(row.rate202))},0)`,'#,##0',{alignment:{horizontal:'right'}});
      r++;
    });
    put(r,8,`Subtotal — ${sec.sub}`,{bold:true,sz:9,alignment:{horizontal:'right'}});
    formula(r,9,`SUM(J${first+1}:J${r})`,'#,##0',{bold:true});
    if(show202) formula(r,10,`SUM(K${first+1}:K${r})`,'#,##0',{bold:true});
    subtotalCells.push(A(r,9));
    r++; r++;
  }

  M.exhaust.forEach(writeSection);
  if(M.fresh.length){
    span(r,'FRESH AIR SUPPLY SYSTEM',{bold:true,sz:12,alignment:{horizontal:'center'}}); r++;
    M.fresh.forEach(writeSection);
  }

  /* totals — formulas, as on the PDF */
  const join=subtotalCells.join('+');
  put(r,7,'Total (before GST)',{bold:true,sz:10,alignment:{horizontal:'right'}}); merge(r,7,8);
  formula(r,9,join||'0','#,##0',{bold:true,sz:11,fill:{fgColor:F(headBg)}}); r++;
  const beforeCell=A(r-1,9);
  put(r,7,`GST @ ${N(S.rates.gst)}%`,{bold:true,sz:10,alignment:{horizontal:'right'}}); merge(r,7,8);
  formula(r,9,`ROUND(${beforeCell}*${N(S.rates.gst)}/100,0)`,'#,##0',{bold:true}); r++;
  put(r,7,'GRAND TOTAL',{bold:true,sz:11,color:F(brandFg),fill:{fgColor:F(brandBg)},alignment:{horizontal:'right'}}); merge(r,7,8);
  formula(r,9,`${beforeCell}+J${r}`,'#,##0',{bold:true,sz:12,color:F(brandFg),fill:{fgColor:F(brandBg)}}); r++;
  r++;

  /* terms */
  span(r,'TERMS & CONDITIONS',{bold:true,sz:10,color:F('1F4E79')}); r++;
  const tc=S.tc||DEFAULT_TC;
  (tc.terms||[]).forEach(t=>{ const lbl=typeof t==='string'?t:(t.label?`${t.label}: ${t.text||''}`:t.text); span(r,'• '+lbl,{sz:8.5,alignment:{wrapText:true}}); ws['!rows'][r]={hpt:14}; r++; });
  if((tc.exclusions||[]).length){
    span(r,'EXCLUSIONS',{bold:true,sz:10,color:F('1F4E79')}); r++;
    tc.exclusions.forEach(t=>{ span(r,'• '+t,{sz:8.5,alignment:{wrapText:true}}); r++; });
  }
  r++;
  span(r,'For '+P.brandTop,{bold:true,sz:10,alignment:{horizontal:'right'}}); r++;
  span(r,'(Authorised Signatory)',{sz:9,color:F('5B666E'),alignment:{horizontal:'right'}}); r++;

  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:r,c:COLS-1}});
  ws['!merges']=merges;
  ws['!cols']=[{wch:4},{wch:26},{wch:52},{wch:7},{wch:7},{wch:7},{wch:7},{wch:8},{wch:11},{wch:13}].concat(show202?[{wch:13}]:[]);

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Quotation');
  return wb;
}

function quoteHTML(){
  if(!S.print || !S.tc) normalise(S);   // a record from an older version can still print safely
  const t = totals();
  const rows=[]; let sl=0;
  const grp = x => `<tr class="grp"><td colspan="6">${x}</td></tr>`;

  if(S.hoods.length){
    rows.push(grp('A. Kitchen exhaust hoods'));
    S.hoods.forEach(h=>{
      const rate=N(h.rate)*(1-N(h.disc)/100);
      rows.push(`<tr><td class="n">${++sl}</td>
        <td><b>${esc(h.type)}</b> — ${h.grade} grade stainless steel
          ${h.filters?`<div class="q-desc">${esc(h.filters)}</div>`:''}${h.remark?`<div class="q-desc">${esc(h.remark)}</div>`:''}</td>
        <td class="n">${F2(h.rft)}</td><td class="n">Rft</td>
        <td class="n">${rate.toLocaleString('en-IN',{maximumFractionDigits:2})}</td>
        <td class="n">${Math.round(hoodAmt(h)).toLocaleString('en-IN')}</td></tr>`);
    });
  }
  if(S.units.length){
    rows.push(grp('B. Blowers / air handling units'));
    S.units.forEach(u=>{
      const rate=N(u.rate)*(1-N(u.disc)/100), m=blowerLookup(u.hp,u.rpm);
      const desc = u.type==='BLOWER'
        ? `<b>Centrifugal Blower with Impeller — ${esc(hpLabel(u))} HP, ${u.rpm} RPM</b>${m?`, ${m.casing}`:''}`
        : `<b>Air Handling Unit (AHU) — ${esc(hpLabel(u))} HP, ${u.rpm} RPM</b>`;
      const fil = u.service==='FA'&&N(u.filters.count)
        ? `<div class="q-desc">Filtration: ${u.filters.count} nos ${esc(u.filters.size)} filters, ${u.filters.micron} micron dust prevention</div>`:'';
      rows.push(`<tr><td class="n">${++sl}</td>
        <td>${desc}
          <div class="q-desc">${u.service==='EXH'?'Exhaust':'Fresh Air'} Line ${u.lineNo} · ${N(u.cfm).toLocaleString('en-IN')} CFM · Installed at ${esc(u.floor||S.bldg.blowerPlace)} on ${esc(S.bldg.mounting)}</div>
          ${fil}${u.remark?`<div class="q-desc">${esc(u.remark)}</div>`:''}</td>
        <td class="n">${u.qty}</td><td class="n">Nos</td>
        <td class="n">${rate.toLocaleString('en-IN',{maximumFractionDigits:2})}</td>
        <td class="n">${Math.round(unitAmt(u)).toLocaleString('en-IN')}</td></tr>`);
    });
  }
  if(S.ducts.length){
    rows.push(grp('C. Ducting'));
    S.ducts.forEach(d=>{
      const rate=N(d.rate)*(1-N(d.disc)/100);
      rows.push(`<tr><td class="n">${++sl}</td>
        <td><b>${d.material} ${d.constr} Ducting — ${d.gauge}</b>
          <div class="q-desc">${d.service==='EXH'?'Exhaust':'Fresh Air'} Line ${d.lineNo} · ${lineCFM(d.service,d.lineNo).toLocaleString('en-IN')} CFM · Size ${d.w} × ${d.h} mm · Length ${F2(ductRmt(d))} Rmt (${F2(ductRft(d))} rft)</div>
          ${d.remark?`<div class="q-desc">${esc(d.remark)}</div>`:''}</td>
        <td class="n">${F2(ductSqm(d))}</td><td class="n">Sqm</td>
        <td class="n">${rate.toLocaleString('en-IN',{maximumFractionDigits:2})}</td>
        <td class="n">${Math.round(ductAmt(d)).toLocaleString('en-IN')}</td></tr>`);
    });
  }
  if(S.products && S.products.length){
    rows.push(grp('E. Additional equipment & products'));
    S.products.forEach(p=>{
      const prate=N(p.rate)*(1-N(p.disc)/100);
      rows.push(`<tr><td class="n">${++sl}</td>
        <td><b>${esc(p.name||'Product')}</b>${p.model?` — Model ${esc(p.model)}`:''}
          <div class="q-desc">${esc((p.customSpec||'').trim()||p.spec||'')}</div></td>
        <td class="n">${N(p.qty)}</td><td class="n">${esc(p.unit||'No')}</td>
        <td class="n">${prate.toLocaleString('en-IN',{maximumFractionDigits:2})}</td>
        <td class="n">${Math.round(prodAmt(p)).toLocaleString('en-IN')}</td></tr>`);
    });
  }

  const ex=[];
  if(N(S.extras.install))   ex.push(['Site installation & commissioning',N(S.extras.install)]);
  if(N(S.extras.transport)) ex.push(['Transportation to site',N(S.extras.transport)]);
  S.extras.others.forEach(o=>{ if(N(o.amt)) ex.push([o.desc||'Other charges',N(o.amt)]); });
  if(ex.length){
    rows.push(grp('D. Installation, transport & other charges'));
    ex.forEach(([d,a])=>rows.push(`<tr><td class="n">${++sl}</td><td><b>${esc(d)}</b></td>
      <td class="n">1</td><td class="n">Lot</td><td class="n">${a.toLocaleString('en-IN')}</td><td class="n">${a.toLocaleString('en-IN')}</td></tr>`));
  }

  const val = S.meta.date ? new Date(new Date(S.meta.date).getTime()+N(S.meta.validity)*864e5).toLocaleDateString('en-IN') : '—';

  return `<div class="q-doc" style="zoom:${N(S.print && S.print.fontSize)||1}">
    <div class="q-head">
      <div class="l">
        <h1>MEGA<span>HOODS</span></h1>
        <div class="tl">Commercial Kitchen Ventilation Systems</div>
        <div style="font-size:10.5px;color:#555;margin-top:6px">A unit of Megaverks Technologies<br>Rajajinagar Industrial Estate, Bengaluru<br>megahoods.com</div>
      </div>

        <b style="font-size:12px">Quotation No</b><br>${esc(S.meta.quoteNo)}${N(S.meta.rev)?' REV '+S.meta.rev:''}<br>
        <b>Date:</b> ${dmy(S.meta.date)}<br><b>Valid till:</b> ${val}<br>
        <b>Prepared by:</b> ${esc(S.meta.coName||'—')}
      </div>
    </div>

    <div class="q-title">${DOC_MODE==='proforma'?'PROFORMA INVOICE':'QUOTATION'}</div>

    <div class="q-meta">
      <div class="bx"><h4>Quotation to</h4>
        <div><b>${esc(S.cust.company||'—')}</b></div>
        <div>${esc(S.cust.name)}</div>
        <div>${esc(S.cust.phone)}${S.cust.email?' · '+esc(S.cust.email):''}</div>
        <div style="margin-top:5px">${esc(S.cust.address||'').replace(/\n/g,'<br>')}</div>
        ${S.cust.gst?`<div style="margin-top:4px"><b>GSTIN:</b> ${esc(S.cust.gst)}</div>`:''}
      </div>
      <div class="bx"><h4>Project & site</h4>
        <div><b>Site:</b> ${esc(S.cust.site||'—')}</div>
        <div><b>Kitchen located at:</b> ${esc(S.bldg.kitchenFloor)}</div>
        <div><b>Blower located at:</b> ${esc(S.bldg.blowerPlace)} — ${esc(S.bldg.mounting)}</div>
        <div><b>Exhaust lines:</b> ${S.lines.exh.length} &nbsp; <b>Fresh air lines:</b> ${S.lines.fa.length}</div>
        <div><b>Installation:</b> ${dmy(S.sch.start)} to ${dmy(S.sch.end)}</div>
      </div>
    </div>

    ${(S.print? S.print.lineSchedule!==false : true) && lineList().length ? `<div class="q-sec" style="margin-top:0">
      <h3>Air line schedule</h3>
      <table class="q-tbl"><tr><th>Line</th><th>Serving</th><th>Design CFM</th><th>Blower / AHU provided</th></tr>
      ${lineList().map(L=>{
        const us=S.units.filter(u=>u.service===L.s&&u.lineNo==L.no);
        return `<tr><td><b>${L.s==='EXH'?'Exhaust':'Fresh Air'} Line ${L.no}</b></td><td>${esc(L.name||'—')}</td>
          <td class="n">${L.cfm.toLocaleString('en-IN')}</td>
          <td>${us.length?us.map(u=>`${u.qty} × ${esc(hpLabel(u))} HP ${u.rpm} RPM ${u.type==='AHU'?'AHU':'Blower'} (${N(u.cfm).toLocaleString('en-IN')} CFM)`).join('; '):'—'}</td></tr>`;
      }).join('')}</table></div>`:''}

    <div class="q-sec">
      <h3>Scope of supply</h3>
      <table class="q-tbl">
        <tr><th style="width:32px">Sl</th><th>Description</th><th style="width:60px">Qty</th><th style="width:46px">Unit</th><th style="width:80px">Rate ₹</th><th style="width:90px">Amount ₹</th></tr>
        ${rows.join('') || '<tr><td colspan="6" style="text-align:center;color:#999">No items added</td></tr>'}
      </table>
      <div class="q-tot">
        <div><span>Total value</span><span>${Math.round(t.net).toLocaleString('en-IN')}</span></div>
        <div><span>GST @ ${S.rates.gst}%</span><span>${Math.round(t.gst).toLocaleString('en-IN')}</span></div>
        <div class="gt"><span>Grand total</span><span>₹ ${Math.round(t.grand).toLocaleString('en-IN')}</span></div>
      </div>
      <div class="q-words"><b>Amount in words:</b> ${words(t.grand)}</div>
    </div>

    ${S.print.scope!==false ? `
    <div class="q-bar">SCOPE OF WORK</div>
    <div class="q-box">
      ${S.tc.scopeSupplier?`<div class="ln">${esc(tok(S.tc.scopeSupplier))}</div>`:''}
      ${S.tc.scopeClient?`<div class="ln">${esc(tok(S.tc.scopeClient))}</div>`:''}
      ${S.tc.scopeNotes.filter(n=>n.trim()).map(n=>`<div class="ln"><b>Note:</b> ${esc(tok(n))}</div>`).join('')}
    </div>`:''}

    ${S.print.exclusions!==false && S.tc.exclusions.filter(x=>x.trim()).length ? `
    <div class="q-bar gold">EXCLUSIONS &nbsp;(NOT INCLUDED IN THIS QUOTATION)</div>
    <div class="q-box"><ul>
      ${S.tc.exclusions.filter(x=>x.trim()).map(x=>`<li>${esc(tok(x))}</li>`).join('')}
    </ul></div>`:''}

    ${S.print.terms!==false && S.tc.terms.filter(t=>t.label||t.text).length ? `
    <div class="q-bar">TERMS &amp; CONDITIONS</div>
    <table class="q-terms">
      ${S.tc.terms.filter(t=>t.label||t.text).map((t,i)=>`<tr>
        <td class="lb">${i+1}. ${esc(tok(t.label))}</td>
        <td>${esc(tok(t.text))}</td></tr>`).join('')}
      ${S.terms.note?`<tr><td class="lb">${S.tc.terms.filter(t=>t.label||t.text).length+1}. Special Note</td><td>${esc(tok(S.terms.note))}</td></tr>`:''}
    </table>`:''}

    <div class="q-sign">
      <div>For <b>MEGAHOODS</b>
        <div class="ln">${S.meta.coName?`<b>${esc(S.meta.coName)}</b>`:''}
          <span>Sales Coordinator${S.meta.coPhone?' · '+esc(S.meta.coPhone):''}${S.meta.coEmail?' · '+esc(S.meta.coEmail):''}</span></div>
      </div>

      </div>

    <div class="q-foot">MEGAHOODS — a unit of Megaverks Technologies · Rajajinagar Industrial Estate, Bengaluru · megahoods.com<br>
      For any clarification on this quotation, contact ${esc(S.meta.coName||'our sales team')}${S.meta.coPhone?' on '+esc(S.meta.coPhone):''}.</div>
  </div>`;
}

function activeQuoteHTML(){ return (S.print&&S.print.format==='megaverks') ? mvQuoteHTML() : quoteHTML(); }
let DOC_MODE = 'quote';        // 'quote' | 'proforma' — set only while generating a proforma
let EDITED_HTML = null;        // hand-edited quotation HTML — wins over generated HTML until "Regenerate"
let EDITED_SIG = '';           // data signature at the moment the hand edit was made
function dataSig(){ return JSON.stringify([S.units,S.ducts,S.hoods,S.products,S.lines,S.rates,S.extras,S.meta.quoteNo,S.meta.rev]); }
function qEditInput(el){
  // only freeze a hand-edited copy when the content really differs from what was rendered
  const base = (typeof window.__qbase === 'string') ? window.__qbase : activeQuoteHTML();
  if(el.innerHTML !== base){ EDITED_HTML = el.innerHTML; EDITED_SIG = dataSig(); }
  else { EDITED_HTML = null; EDITED_SIG = ''; }
  const f = document.getElementById('qeditflag'), r = document.getElementById('qregen');
  if(f) f.style.display = EDITED_HTML ? '' : 'none';
  if(r) r.style.display = EDITED_HTML ? '' : 'none';
}
function editedIsStale(){ return !!(EDITED_HTML && EDITED_SIG && EDITED_SIG !== dataSig()); }
function currentDocHTML(){
  const el = document.getElementById('qedit');
  if(el) qEditInput(el);
  return EDITED_HTML || activeQuoteHTML();
}
function regenQuote(){ if(!confirm('Discard your hand edits and regenerate the quotation from the current data?')) return; EDITED_HTML=null; EDITED_SIG=''; render(); toast('Regenerated from data.'); }
function proformaNo(){ const q=S.meta.quoteNo||''; return q.includes('/QT') ? q.replace('/QT','/PI') : q+'-PI'; }
function proformaHTML(){ DOC_MODE='proforma'; const h=activeQuoteHTML(); DOC_MODE='quote'; return h; }
function printProforma(){
  const p=document.getElementById('printArea');
  p.innerHTML=proformaHTML(); p.style.display='block';
  window.print();
  setTimeout(()=>{p.style.display='none';p.innerHTML='';},400);
  if(typeof clipVictoryLap==='function') clipVictoryLap('Proforma invoice <b>'+esc(proformaNo())+'</b> is ready — send it and close that order!',
    [{ label: 'Back to quotation', act: function(){ go('preview'); clipDismiss(); } },
     { label: 'Thanks Chef', act: clipMenu }]);
}

function annexPhotoAdd(si,ri,input){
  const files=[...input.files]; if(!files.length) return;
  let done=0;
  files.forEach(f=>{
    const rd=new FileReader();
    rd.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const mx=720, sc=Math.min(1,mx/Math.max(img.width,img.height));
        const cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(img.width*sc)); cv.height=Math.max(1,Math.round(img.height*sc));
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        ANNEX.sections[si].rows[ri].photos.push(cv.toDataURL('image/jpeg',0.8));
        if(++done===files.length){ annexSave(); render(); toast(files.length+' photo(s) added to the annexure.'); }
      };
      img.src=e.target.result;
    };
    rd.readAsDataURL(f);
  });
}

async function saveQuote(){
  if(!S.cust.company){ toast('Enter the customer company name — that is the folder name.'); go('customer'); return; }
  const f = await ensureFolder(S.cust.company);
  S.custId = f.id;
  if(RECORDS.some(r=>r.id!==S.id && r.meta.quoteNo===S.meta.quoteNo && N(r.meta.rev)===N(S.meta.rev))){
    S.meta.quoteNo = nextQuoteNo();
    toast('That quotation number was already used — renumbered to ' + S.meta.quoteNo);
  }
  const t = totals();
  const rec = {...JSON.parse(JSON.stringify(S)), editedHtml:EDITED_HTML||null, _total:t.grand, _net:t.net, _saved:new Date().toISOString()};
  const i = RECORDS.findIndex(r=>r.id===S.id);
  if(i>=0) RECORDS[i]=rec; else RECORDS.unshift(rec);
  await saveAll();
  if(ACTIVE_LEAD){
    const l=LEADS.find(x=>x.id===ACTIVE_LEAD);
    if(l){ l.stage='Converted'; l.converted=S.meta.quoteNo; await leadsSave(); }
    ACTIVE_LEAD=null;
  }
  toast(`Filed in 📁 ${f.company} — ${S.meta.quoteNo} · ${R0(t.grand)}`);
  render();
  if(typeof clipCheerQuote==='function') setTimeout(()=>clipCheerQuote({qRef:S.meta.quoteNo, grand:t.grand}), 600);
  if(HOST.auto && HOST.url){
    try{
      const P = quotePayload(false); P.record = JSON.parse(JSON.stringify(S));
      delete P.photos; delete P.docs;
      await hostPost('quote', P);
      HOST.last = `Backed up ${S.meta.quoteNo} · ${new Date().toLocaleString('en-IN')}`;
      await hostSave();
      toast('Also backed up to your server.');
    }catch(e){ toast('Saved locally. Server backup failed: ' + e.message); }
  }
  if(cloudOn()){
    try{
      const P = quotePayload(true);
      const rc = JSON.parse(JSON.stringify(S)); (rc.visits||[]).forEach(v=>{ v.photo=''; v.photos=[]; });
      P.record = rc;
      const d = await cloudPost('quote', P);
      CLOUD.lastFolder=d.folder; CLOUD.lastPdf=d.pdf; CLOUD.lastSheet=d.sheet; await cloudSave();
      toast('Also uploaded to Google Drive.');
    }catch(e){ toast('Saved locally. Drive upload failed: ' + e.message); }
  }
}

  const r = payFind(rid); if(!r) return;
  const g = id => document.getElementById(id);
  const amount = N(g('pay_amt_'+rid) && g('pay_amt_'+rid).value);
  if(amount <= 0){ toast('Enter the received amount first.'); return; }
  const p = { id:uid(), quoteNo:r.meta.quoteNo, rev:N(r.meta.rev), company:r.cust.company, project:r.cust.site,
    date:(g('pay_dt_'+rid) && g('pay_dt_'+rid).value) || new Date().toISOString().slice(0,10),
    amount, mode:(g('pay_mode_'+rid) && g('pay_mode_'+rid).value) || '',
    utr:(g('pay_utr_'+rid) && g('pay_utr_'+rid).value) || '',
    note:(g('pay_note_'+rid) && g('pay_note_'+rid).value) || '',
    grand:N(r._total), at:new Date().toISOString() };
  r.payments = Array.isArray(r.payments) ? r.payments : [];
  r.payments.push(p);
  r.meta.paid = paidTotal(r);
  await saveAll();
  if(cloudOn()){ try{ await cloudPost('payment', p); }catch(e){ toast('Saved locally. Payment sync failed: ' + e.message); } }
  render();

  if(cloudOn()){ try{ await cloudPost('payment_delete', { id:pid }); }catch(e){} }

function recSet(id, path, val){
  const r=RECORDS.find(x=>x.id===id); if(!r) return;
  const p=path.split('.'); let o=r;
  for(let i=0;i<p.length-1;i++) o=o[p[i]];
  o[p[p.length-1]]=(path==='meta.paid'?N(val):val);
  saveAll();
}
async function setStatus(id,st){
  const r=RECORDS.find(x=>x.id===id); if(!r) return;
  r.meta.status=st; await saveAll(); render();
  if(isWon(st)){
    toast(st==='Installation Done'
      ? 'Installation done — recorded, and synced to the Installations sheet when auto-sync is on.'
      : 'Marked Won — this site now appears in the Warranty Tracker and After-Sales CRM.');
    if(typeof clipCheerWon==='function') clipCheerWon(r.cust.company, r._total);
    if(cloudOn()){

        await cloudPost('quote',P); S=keepS;
      }catch(e){ toast('Status saved locally. Drive sync failed: '+e.message); }
    }
  }
}

/* ---------- WARRANTY ---------- */
function warrantyRows(){
  const out=[];
  RECORDS.filter(r=>r&&((r.meta&&isWon(r.meta.status))||(r.sch&&r.sch.commissioned))).forEach(r=>{
    const c=r.sch&&r.sch.commissioned;
    const add=(cat,months,det)=>{
      if(!c){ out.push({r,cat,det,start:'',end:'',days:null,st:'grey',msg:'Commissioning date not set'}); return; }
      const st=new Date(c), en=new Date(st); en.setMonth(en.getMonth()+N(months));
      const days=Math.ceil((en-new Date())/864e5);
      let s='ok',m=`${days} days left`;
      if(days<0){s='bad';m=`Expired ${Math.abs(days)} days ago`;}
      else if(days<=60){s='warn';m=`Expiring in ${days} days`;}
      out.push({r,cat,det,start:st,end:en,days,st:s,msg:m});
    };
    if(r.hoods.length) add('Hoods', N(r.rates&&r.rates.wHood)||12, `${F2(r.hoods.reduce((s,h)=>s+N(h.rft),0))} rft · ${[...new Set(r.hoods.map(h=>h.grade))].join(', ')}`);
    if(r.units.length) add('Blowers / AHU', N(r.rates&&r.rates.wBlower)||12, r.units.map(u=>`${u.qty}×${u.hp}HP ${u.rpm}RPM`).join(', '));
    if(r.ducts.length) add('Ducting', N(r.rates&&(r.rates.wDuct||r.rates.wHood))||12, `${F2(r.ducts.reduce((s,d)=>s+ductSqm(d),0))} sqm`);
  });
  return out;
}

let TICKETS = [];
let TK = null;                    // draft ticket while the form is open
const TK_STATUSES = ['Open','Visit Scheduled','In Progress','Resolved','Closed'];
const TK_ISSUES = ['Breakdown — not working','Low suction / airflow','Unusual noise','Vibration',
  'Grease leakage','Filter cleaning / replacement','Electrical fault','AMC / preventive maintenance',
  'Installation defect','Performance check','Other'];
const TK_CATS = ['Whole system','Hood','Blower / AHU','Ducting','Electrical','Filters','Other'];
const TK_PRI = ['Low','Normal','High','Urgent'];

function ticketNo(){
  const t=new Date(), ym=String(t.getFullYear()).slice(2)+String(t.getMonth()+1).padStart(2,'0');
  const base='MH/SR/'+ym+'/';
  let n=1; const used=new Set(TICKETS.map(x=>x.no));
  while(used.has(base+String(n).padStart(3,'0'))) n++;
  return base+String(n).padStart(3,'0');
}
function tkSave(){ Store.set('mh_tickets', TICKETS); }
function commissionedSites(){ return RECORDS.filter(r=>r&&((r.meta&&isWon(r.meta.status))||(r.sch&&r.sch.commissioned))); }
function tkOpen(t){ return t.status!=='Resolved' && t.status!=='Closed'; }
function tkRecord(t){ return RECORDS.find(r=>r.id===t.recordId); }

function startTicket(recId){
  const r = RECORDS.find(x=>x.id===recId);
  TK = { no: ticketNo(), recordId: r?r.id:'', folderId: r?r.custId:'',
    site: r?r.cust.site:'', contact: r?r.cust.name:'', phone: r?r.cust.phone:'',
    cat:'Whole system', issue:TK_ISSUES[0], priority:'Normal', desc:'', tech:S.meta.coName||'', sched:'',
    created:new Date().toISOString().slice(0,10) };
  TAB='service'; render(); window.scrollTo(0,0);
}
async function saveTicket(){
  if(!TK) return;
  if(!TK.recordId){ toast('Choose the site / quotation this ticket belongs to.'); return; }
  if(!(TK.desc||'').trim()){ toast('Describe the issue — the technician needs it.'); return; }
  TICKETS.unshift({ id:uid(), no:TK.no, recordId:TK.recordId, folderId:TK.folderId,
    created:TK.created, site:TK.site, contact:TK.contact, phone:TK.phone,
    cat:TK.cat, issue:TK.issue, priority:TK.priority, desc:TK.desc.trim(),
    tech:TK.tech, sched:TK.sched, status: TK.sched?'Visit Scheduled':'Open',
    visits:[], photos:[], resolution:'', parts:'', charges:0, nextDue:'', closed:'' });
  TK=null; await tkSave(); render(); toast('Service ticket raised.');
  if(cloudOn()) cloudTicket(TICKETS[0]);
  if(typeof clipSay==='function' && CLIP.ready && !CLIP.muted)
    clipSay('Ticket logged. I will watch the schedule — if a visit date slips, I will put the red dot on.', clipMainChips(), 'nod');

function tkPickSite(id){

function tkStatusNext(i){
  const t=TICKETS[i], k=TK_STATUSES.indexOf(t.status);
  if(k<0 || k>=TK_STATUSES.length-1) return;
  const nxt=TK_STATUSES[k+1];
  if(nxt==='Resolved'){
    const res=prompt('Resolution summary — what was done?'); if(res===null) return;
    t.resolution=res;
    const nd=prompt('Next service due date (YYYY-MM-DD) — leave blank to skip:'); if(nd) t.nextDue=nd;
  }
  if(nxt==='Closed') t.closed=new Date().toISOString().slice(0,10);
  t.status=nxt; tkSave(); render();
  if(cloudOn()) cloudTicket(t);
}
function tkVisit(i){
  const note=prompt('Visit note — what was done on site?'); if(note===null||!note.trim()) return;
  const t=TICKETS[i];
  if(!Array.isArray(t.visits)) t.visits=[];
  t.visits.push({date:new Date().toISOString().slice(0,10), note:note.trim()});
  if(t.status==='Open'||t.status==='Visit Scheduled') t.status='In Progress';
  tkSave(); render();
  if(cloudOn()) cloudTicket(t);
}
async function tkPhotoAdd(i,input){
  const t=TICKETS[i]; if(!t) return;

  if(cloudOn()) cloudTicket(t);

/* ==================== Clip, the paperclip assistant ==================== */
var CLIP = { typing: null, queue: [], muted: false, blinkTimer: null, idleTimer: null, dozeTimer: null, ready: false, lapping: false, hidden: false };

function clipEl(id) { return document.getElementById(id); }

function clipToggleVisible(){
  var wrap = clipEl('clipWrap'); if(!wrap) return;
  CLIP.hidden = !CLIP.hidden;
  wrap.style.display = CLIP.hidden ? 'none' : 'flex';
  try { localStorage.setItem('mh_clip_hidden', CLIP.hidden ? '1' : '0'); } catch(e) {}
  clipToggleBtn();
  if(!CLIP.hidden && CLIP.ready && !CLIP.muted) clipSay('Back on duty — watching your quotes, warranties and tickets.', clipMainChips(), 'cheer');
}
function clipToggleBtn(){
  var b = document.getElementById('clipToggle'); if(!b) return;
  b.innerHTML = CLIP.hidden ? '🧑‍🍳 Chef: OFF' : '🧑‍🍳 Chef: ON';
  b.className = 'btn ghost sm' + (CLIP.hidden ? '' : ' on2');
}
function clipInit() {
  try { CLIP.muted = localStorage.getItem('mh_clip_muted') === '1'; } catch(e) {}
  try { CLIP.hidden = localStorage.getItem('mh_clip_hidden') === '1'; } catch(e) {}
  var wrap = clipEl('clipWrap');
  if (!wrap) return;
  wrap.style.display = CLIP.hidden ? 'none' : 'flex';
  CLIP.ready = true;
  clipToggleBtn();
  if (CLIP.hidden) return;
  clipStartBlinking();
  clipTrackEyes();
  var btn = clipEl('clipBtn');
  if (btn) btn.addEventListener('mouseenter', function(){ btn.classList.remove('dozing'); });
  setTimeout(clipGreet, 700);
}

/* ---------- Expressions ---------- */
function clipDo(move, ms) {
  var b = clipEl('clipBtn');
  if (!b) return;
  b.classList.remove('wave','bounce','cheer','think','nod');
  void b.offsetWidth;                       // restart the animation
  if (move) b.classList.add(move);
  if (ms) setTimeout(function(){ b.classList.remove(move); }, ms);
}

function clipStartBlinking() {

    b.classList.add('blink');
    setTimeout(function(){ b.classList.remove('blink'); }, 130);
    if (Math.random() < 0.3) setTimeout(function() {      // occasional double blink
      b.classList.add('blink');
      setTimeout(function(){ b.classList.remove('blink'); }, 120);
    }, 260);

}

/* Pupils follow the cursor, and drift on touch devices */
function clipTrackEyes() {
  document.addEventListener('mousemove', function(e) {
    var btn = clipEl('clipBtn');
    if (!btn) return;
    var r = btn.getBoundingClientRect();
    if (!r.width) return;
    var cx = r.left + r.width / 2, cy = r.top + r.height * 0.36;
    var dx = e.clientX - cx, dy = e.clientY - cy;
    var d = Math.max(1, Math.hypot(dx, dy));
    var m = Math.min(3.4, d / 90);
    var tx = (dx / d) * m, ty = (dy / d) * m;
    ['clipPupilL','clipPupilR'].forEach(function(id) {
      var p = clipEl(id);
      if (p) p.style.transform = 'translate(' + tx.toFixed(2) + 'px,' + ty.toFixed(2) + 'px)';
    });
  }, { passive: true });
}

/* ---------- Speech ---------- */
function clipSay(text, chips, move) {
  if (!CLIP.ready) return;
  var bubble = clipEl('clipBubble'), say = clipEl('clipSay'), chipBox = clipEl('clipChips');
  if (!bubble) return;
  clearInterval(CLIP.typing);
  bubble.classList.add('show');
  clipEl('clipDot').style.display = 'none';
  if (move) clipDo(move, 2600);

  chipBox.innerHTML = '';
  var i = 0;
  say.innerHTML = '<span class="clip-caret"></span>';
  CLIP.typing = setInterval(function() {
    i++;
    if (i >= text.length) {
      clearInterval(CLIP.typing);
      say.innerHTML = text;
      (chips || []).forEach(function(c) {
        var b = document.createElement('button');
        b.className = 'clip-chip';
        b.textContent = c.label;
        b.onclick = c.act;
        chipBox.appendChild(b);
      });
    } else {
      say.innerHTML = text.slice(0, i) + '<span class="clip-caret"></span>';
    }
  }, 16);
  clipResetIdle();
}

function clipResetIdle() {
  clearTimeout(CLIP.idleTimer);
  var btn = clipEl('clipBtn');
  if (btn) btn.classList.remove('dozing');
  clearTimeout(CLIP.dozeTimer);
  CLIP.idleTimer = setTimeout(function() {
    var b = clipEl('clipBubble');
    if (b) b.classList.remove('show');
  }, 22000);
  // fade back so he never sits on top of a button you are reaching for
  CLIP.dozeTimer = setTimeout(function() {
    var x = clipEl('clipBtn');
    if (x) x.classList.add('dozing');
  }, 9000);
}

function clipDismiss() {
  clipEl('clipBubble').classList.remove('show');
  clearInterval(CLIP.typing);
}

function clipTap() {

function clipName() {
  var n = (S && S.meta && S.meta.coName) || (PROFILE && PROFILE.signName) || '';
  return n.split(' ')[0];
}

function clipTimeWord() {
  var h = new Date().getHours();
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  return 'Good evening';
}

function clipGreet() {
  if (CLIP.muted) return;
  var name = clipName();
  var last = null, visits = 0;
  try {
    last = localStorage.getItem('mh_clip_last');
    visits = parseInt(localStorage.getItem('mh_clip_visits') || '0', 10);
  } catch(e) {}
  visits++;
  try {
    localStorage.setItem('mh_clip_last', new Date().toISOString().slice(0,10));
    localStorage.setItem('mh_clip_visits', String(visits));
  } catch(e) {}

  var days = null;
  if (last) {
    var d = Math.round((new Date().setHours(0,0,0,0) - new Date(last + 'T00:00:00')) / 86400000);
    if (!isNaN(d)) days = d;
  }

  var msg;
  var who = name ? ' <b>' + esc(name) + '</b>' : '';
  if (visits === 1) {
    msg = 'Hello' + who + '! I am <b>Chef Mega</b> — your kitchen-ventilation sous-chef. I watch your quotations, warranties and service tickets while you cook up sales. Tap me any time.';
  } else if (days === null || days === 0) {
    msg = clipTimeWord() + who + '! Back for more. What are we quoting?';
  } else if (days === 1) {
    msg = clipTimeWord() + who + '! Good to see you again today.';
  } else if (days <= 3) {
    msg = 'Welcome back' + who + '! It has been ' + days + ' days. Let me catch you up.';
  } else if (days <= 14) {
    msg = 'Welcome back' + who + '! ' + days + ' days away &mdash; I kept everything safe for you.';
  } else {
    msg = 'There you are' + who + '! ' + days + ' days is a long time. Plenty to catch up on.';
  }
  clipSay(msg, clipMainChips(), 'wave');
  setTimeout(function() { if (!CLIP.muted) clipBriefBadge(); }, 1400);
}

/* Money in short Indian form for speech bubbles */
function short(n) {
  n = Math.abs(N(n));
  if (n >= 1e7) return (n/1e7).toFixed(1).replace(/\.0$/,'') + ' Cr';
  if (n >= 1e5) return (n/1e5).toFixed(1).replace(/\.0$/,'') + ' L';
  if (n >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'') + 'k';
  return String(Math.round(n));
}

/* Red dot if something genuinely needs attention */
function clipBriefBadge() {
  var n = clipAttention().length;
  var dot = clipEl('clipDot');
  if (dot) dot.style.display = n ? 'block' : 'none';
}

function clipAttention() {
  var out = [];
  try {
    // quotations sent or in negotiation whose validity has lapsed without a decision
    var stale = RECORDS.filter(function(r) {
      if (r.meta.status !== 'Sent' && r.meta.status !== 'Negotiation') return false;
      var d = new Date(r.meta.date); d.setDate(d.getDate() + N(r.meta.validity || 30));
      return d < new Date();
    });
    if (stale.length) out.push({ kind: 'stale', n: stale.length, items: stale });
    // warranties expiring within 60 days or already expired
    var w = warrantyRows().filter(function(x){ return x.st === 'warn' || x.st === 'bad'; });
    if (w.length) out.push({ kind: 'warranty', n: w.length, items: w });
    // service tickets: overdue scheduled visits first, then anything still open
    var open = TICKETS.filter(function(t){ return t.status !== 'Resolved' && t.status !== 'Closed'; });
    var today = new Date().toISOString().slice(0,10);
    var late = open.filter(function(t){ return t.sched && t.sched < today; });
    if (late.length) out.push({ kind: 'latevisits', n: late.length, items: late });
    else if (open.length) out.push({ kind: 'tickets', n: open.length, items: open });
    // payments: orders with balance pending, oldest invoice/quote date first
    var dues = RECORDS.filter(function(r){ return N(r._total) > 0 && dueAmt(r) > 0; });
    if (dues.length) out.push({ kind: 'dues', n: dues.length, items: dues,
      amt: dues.reduce(function(s,r){ return s + dueAmt(r); }, 0) });
  } catch(e) {}
  return out;
}

/* ---------- Victory lap ---------- */
function clipVictoryLap(msg, chips) {
  if (CLIP.muted || !CLIP.ready || CLIP.lapping) return;
  var wrap = clipEl('clipWrap'), btn = clipEl('clipBtn');
  if (!wrap) return;
  CLIP.lapping = true;
  clipDismiss();
  btn.classList.remove('dozing');
  clearTimeout(CLIP.dozeTimer);

  clipConfetti(80);
  wrap.classList.remove('lap','back');
  void wrap.offsetWidth;
  wrap.classList.add('lap');

  // face the other way on the run home
  setTimeout(function(){ wrap.classList.add('back'); }, 2700);

  // sparkle trail follows him round
  var trail = setInterval(function() {
    var r = btn.getBoundingClientRect();
    if (!r.width) return;
    var d = document.createElement('span');
    d.className = 'clip-trail';
    d.style.left = (r.left + r.width/2 - 4 + (Math.random()*16-8)) + 'px';
    d.style.top  = (r.top + r.height/2 - 4 + (Math.random()*16-8)) + 'px';
    document.body.appendChild(d);
    setTimeout(function(){ d.remove(); }, 720);
  }, 55);

  setTimeout(function() {
    clearInterval(trail);
    wrap.classList.remove('lap','back');
    CLIP.lapping = false;
    clipConfetti(40);
    clipSay(msg, chips || [{ label: 'Thanks Chef', act: clipMenu }], 'cheer');
  }, 5200);
}

function clipConfetti(n) {

    var c = document.createElement('span');
    c.className = 'clip-conf';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = (-12 - Math.random() * 22) + 'vh';
    c.style.background = colours[Math.floor(Math.random() * colours.length)];
    c.style.animationDelay = (Math.random() * 0.7) + 's';
    c.style.animationDuration = (2 + Math.random() * 1.4) + 's';

    box.appendChild(c);

    (value ? ' &mdash; Rs. ' + short(value) : '') + '! I had to run a lap for that one.',
    [{ label: 'Open after-sales CRM', act: function(){ go('service'); clipDismiss(); } },
     { label: 'Thanks Chef', act: clipMenu }]);
}

/* ---------- EXPORTS ---------- */
function exportXLSX(){
  if(typeof XLSX==='undefined'){ toast('Excel export needs an internet connection the first time. Use Print / Save as PDF instead.'); return; }
  const t=totals();
  const wb = mvExcel(XLSX, mvModel(), S, PROFILE);   // Quotation sheet = same layout as the PDF, with live formulas
  const ic=[['INTERNAL — discounts, costs & margins','(your eyes only — never shared)'],[],
    ['List price (before discounts)',t.list],['Discounts given',-t.disc],['Net',t.net],
    ['GST',t.gst],['Grand total',t.grand],['Cost of goods',t.unitC],['Gross margin',t.net-t.unitC],
    ['Margin %',t.net?(t.net-t.unitC)/t.net*100:0]];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ic), 'Internal');
  const b=[['Line','Serving','Design CFM','Installed CFM','Deviation %','Status']];
  balance().forEach(x=>b.push([x.label,x.name||'',x.cfm,x.inst,x.dev,x.msg]));
  b.push([],['Duct','Size (mm)','Rmt','Rft','Sqm','Velocity fpm','Rate','Amount']);
  S.ducts.forEach((d,n)=>b.push([`Duct ${n+1} — ${d.service} L${d.lineNo}`,`${d.w}x${d.h}`,ductRmt(d),ductRft(d),ductSqm(d),ductVel(d).fpm,N(d.rate),ductAmt(d)]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(b), 'Engineering');
  const tcs=[['SCOPE OF WORK'],[tok(S.tc.scopeSupplier)],[tok(S.tc.scopeClient)]];
  S.tc.scopeNotes.filter(n=>n.trim()).forEach(n=>tcs.push(['Note: '+tok(n)]));
  tcs.push([],['EXCLUSIONS']);
  S.tc.exclusions.filter(x=>x.trim()).forEach((x,i)=>tcs.push([i+1, tok(x)]));
  tcs.push([],['TERMS & CONDITIONS'],['#','Clause','Detail']);
  S.tc.terms.filter(t=>t.label||t.text).forEach((t,i)=>tcs.push([i+1, tok(t.label), tok(t.text)]));
  if(S.terms.note) tcs.push(['', 'Special Note', tok(S.terms.note)]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(tcs), 'Terms');
  XLSX.writeFile(wb, `${S.meta.quoteNo.replace(/\//g,'-')}_${safeName(S.cust.company)}.xlsx`);
  toast('Excel exported.');
}
function exportJSON(){
  const blob=new Blob([JSON.stringify({folders:FOLDERS,records:RECORDS,tickets:TICKETS,template:TPL,profile:PROFILE,current:S},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`MEGAHOODS_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click(); toast('Backup downloaded.');
}
function importJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(d.folders) FOLDERS=d.folders;
      if(d.records) RECORDS=d.records;
      if(d.template){ TPL=d.template; await Store.set('mh_terms',TPL); }
      if(d.profile){ PROFILE=Object.assign(PROFILE,d.profile); await Store.set('mh_profile',PROFILE); }
      if(d.current){ S=normalise(d.current); }
      if(d.tickets){ TICKETS=d.tickets; await Store.set('mh_tickets',TICKETS); }
      migrate(); await saveAll(); render(); toast('Backup restored.');
    }catch(err){ toast('That file could not be read.'); }
  };
  r.readAsText(f);
}

(async ()=>{
  FOLDERS = (await Store.get('mh_folders')) || [];
  RECORDS = (await Store.get('mh_records')) || [];
  TICKETS = (await Store.get('mh_tickets')) || [];
  TPL     = (await Store.get('mh_terms')) || null;
  const storedCloud = (await Store.get('mh_cloud')) || {};
  CLOUD   = Object.assign({url:DEFAULT_CLOUD_URL,key:'',auto:true}, storedCloud);
  if(!('auto' in storedCloud)) CLOUD.auto = true;   // older installs upgrade to auto-sync
  if(!CLOUD.url) CLOUD.url = DEFAULT_CLOUD_URL;   // pre-filled; only the secret key needs typing
  HOST    = Object.assign({url:'',key:'',auto:false,last:''}, (await Store.get('mh_host')) || {});
  PROFILE = Object.assign(PROFILE, (await Store.get('mh_profile')) || {});
  if(PROFILE.brandTop==='MEGAVERKS') PROFILE.brandTop='MEGAHOODS';              // brand renamed
  if(PROFILE.brandSub==='SUNPARK | MEGAVENTS') PROFILE.brandSub='MEGAVENTS';
  ANNEX = (await Store.get('mh_annex')) || JSON.parse(JSON.stringify(ANNEX_FACTORY));
  LEADS = Object.assign([], (await Store.get('mh_leads')) || []);
  COST = (await Store.get('mh_costing')) || null;
  LEAD = Object.assign({ url: LEAD_URL_DEFAULT, pass: '171335', auto: true }, (await Store.get('mh_lead')) || {});
  LOCK = Object.assign({on:true,hash:'',updated:''}, (await Store.get('mh_lock')) || {});
  if(!LOCK.hash){ LOCK.hash = await pinHash('1234'); LOCK.on = true; await Store.set('mh_lock', LOCK); }
  const MM = (await Store.get('mh_masters')) || null;
  if(MM){ if(Array.isArray(MM.blowers)&&MM.blowers.length) BLOWER_MASTER=MM.blowers; if(Array.isArray(MM.hoods)&&MM.hoods.length) HOOD_MASTER=MM.hoods;
    if(Array.isArray(MM.unitTypes)&&MM.unitTypes.length) UNIT_TYPES=MM.unitTypes; if(Array.isArray(MM.otherProducts)) OTHER_PRODUCTS=MM.otherProducts;
    if(Array.isArray(MM.starters)&&MM.starters.length) STARTER_MASTER=MM.starters; }
  if(TPL) S.tc = JSON.parse(JSON.stringify(TPL));
  migrate();                       // repair + folder-link anything from an older version
  await saveAll();
  S.meta.quoteNo = nextQuoteNo();  // no collision with a number already used today
  TAB = FOLDERS.length ? 'folders' : 'setup';
  render();
  checkLock();
  setTimeout(()=>{ autoPull(true); }, 900);                 // pull everything on startup — no passkey needed
  setTimeout(function(){ if (typeof clipInit === 'function') clipInit(); }, 400);
  setInterval(function(){ if(!document.hidden) autoPull(); }, 2*60*1000);          // keep every device fresh
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) autoPull(); });
  window.addEventListener('focus', function(){ autoPull(); });
  window.addEventListener('online', function(){ autoPull(true); });
  setInterval(function(){ if(LEAD.auto && TAB==='leader' && !document.hidden) leadFetch(false); }, 60*1000);
})();
