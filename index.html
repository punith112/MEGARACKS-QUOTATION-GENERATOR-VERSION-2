<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEGAHOODS — Quotation Generator, Folders, Sales, Warranty & After-Sales CRM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --steel-900:#141719; --steel-800:#1d2226; --steel-700:#2a3136; --steel-500:#5a656d;
  --steel-300:#aab4bb; --steel-100:#e7ebee; --panel:#f4f6f7; --white:#fff;
  --flame:#ff7a1a; --signal:#00c07f; --alert:#e5342c; --warn:#f0b400;
  --ink:#12161a; --line:#d3dade; --radius:6px; --shadow:0 1px 0 rgba(0,0,0,.04), 0 8px 24px -18px rgba(0,0,0,.35);
  --navy:#1F3A5F; --bg:#f4f6f7; --shadow-lg:0 12px 32px -12px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--panel);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono","Consolas",ui-monospace,monospace;font-variant-numeric:tabular-nums}

header{background:linear-gradient(180deg,var(--steel-800),var(--steel-900));color:#fff;padding:14px 18px;position:sticky;top:0;z-index:40;border-bottom:3px solid var(--flame)}
.hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:5px;background:var(--flame);display:grid;place-items:center;font-weight:800;color:#141719;font-size:17px;letter-spacing:-.5px}
.brand h1{font-size:16px;margin:0;letter-spacing:.6px;font-weight:700}
.brand small{display:block;color:var(--steel-300);font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;font-weight:600}
.hspacer{flex:1}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.crumb{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600}
.crumb b{color:var(--flame)}

nav.tabs{background:var(--steel-700);display:flex;overflow-x:auto;position:sticky;top:66px;z-index:35;border-bottom:1px solid #000}
nav.tabs button{background:transparent;border:0;color:var(--steel-300);padding:11px 15px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.05)}
nav.tabs button.on{color:#fff;background:var(--steel-800);border-bottom-color:var(--flame)}
nav.tabs button .n{display:inline-block;min-width:16px;font-size:10px;color:var(--flame);margin-right:6px;font-family:ui-monospace,monospace}

main{max-width:1400px;margin:0 auto;padding:18px 16px 90px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.card>h2{margin:0;padding:11px 14px;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;background:var(--steel-800);color:#fff;font-weight:700;display:flex;align-items:center;gap:8px}
.card>h2 .tag{margin-left:auto;font-size:10px;color:var(--steel-300);letter-spacing:.5px;text-transform:none;font-weight:500}
.card .body{padding:14px}

.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:900px){.g3,.g4,.g5{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}

label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--steel-500);margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:4px;background:#fbfcfc;font-size:13.5px;font-family:inherit;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--flame);outline-offset:-1px;background:#fff}
input[readonly]{background:#eef1f2;color:var(--steel-500)}
textarea{min-height:70px;resize:vertical}
input[type=number]{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

.btn{background:var(--steel-700);color:#fff;border:0;padding:8px 13px;border-radius:4px;font-size:12.5px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--steel-800)}
.btn.pri{background:var(--flame);color:#14181a}.btn.pri:hover{background:#ff9040}
.btn.ok{background:var(--signal);color:#06251a}
.btn.dan{background:var(--alert)}
.btn.ghost{background:#fff;color:var(--steel-700);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--steel-100)}
.btn.sm{padding:5px 9px;font-size:11.5px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--steel-100);text-align:left;padding:7px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--steel-700);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid #edf1f2;vertical-align:middle}
tr:hover td{background:#fafcfc}
.num{text-align:right;font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}

.item{border:1px solid var(--line);border-left:4px solid var(--steel-500);border-radius:5px;padding:12px;margin-bottom:12px;background:#fdfefe}
.item.exh{border-left-color:var(--flame)}
.item.fa{border-left-color:#2a8fd8}
.itemhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.itemhead .idx{background:var(--steel-800);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:3px;font-family:ui-monospace,monospace}
.itemhead .ttl{font-weight:700;font-size:13.5px}
.itemhead .sp{flex:1}

.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700}
.chip.ok{background:#d9f7ec;color:#046b4a}.chip.warn{background:#fff2cf;color:#7a5800}
.chip.bad{background:#fde0de;color:#9c1810}.chip.info{background:#dcecf9;color:#0a5480}
.chip.grey{background:var(--steel-100);color:var(--steel-700)}

.readout{background:var(--steel-900);color:var(--flame);border-radius:5px;padding:9px 11px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:15px;font-weight:700}
.readout small{display:block;color:var(--steel-300);font-size:9.5px;letter-spacing:1.2px;font-weight:600;text-transform:uppercase;margin-bottom:2px}
.readout.g{color:var(--signal)}.readout.w{color:var(--warn)}.readout.r{color:#ff6b62}

.internal{background:#fff8ec;border:1px dashed var(--warn);border-radius:4px;padding:8px;margin-top:8px}
.internal .lbl{font-size:9.5px;font-weight:800;letter-spacing:1px;color:#8a6400;text-transform:uppercase;margin-bottom:6px}
body.hideint .internal{display:none}
body.hideint .intonly{display:none!important}

.notebar{background:#eef7fd;border-left:3px solid #2a8fd8;padding:8px 11px;font-size:12px;border-radius:0 4px 4px 0;margin-bottom:12px;color:#0a4a72}
.warnbar{background:#fff6e5;border-left:3px solid var(--warn);padding:8px 11px;font-size:12px;border-radius:0 4px 4px 0;margin-bottom:12px;color:#7a5800}

.photo{width:100%;height:120px;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:var(--steel-100)}
.tot{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.tot.big{font-size:17px;font-weight:800;border-bottom:0;border-top:2px solid var(--steel-800);margin-top:6px;padding-top:11px}
.tot .v{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:700}
.stat{background:var(--steel-800);color:#fff;border-radius:5px;padding:11px}
.stat b{display:block;font-size:19px;font-family:"JetBrains Mono",ui-monospace,monospace;color:var(--flame)}
.stat span{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--steel-300);font-weight:600}

/* Folders */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.folder{
  background:#fff;border:1px solid var(--line);border-top:4px solid var(--flame);border-radius:5px;padding:14px;cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease;position:relative
}
.folder:hover{transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(0,0,0,.45)}
.folder .fname{font-weight:800;font-size:14.5px;margin-bottom:2px;word-break:break-word}
.folder .fsite{font-size:11.5px;color:var(--steel-500);margin-bottom:10px;min-height:16px}
.folder .fmeta{display:flex;gap:6px;flex-wrap:wrap;font-size:10.5px}
.folder .fval{margin-top:9px;font-family:ui-monospace,monospace;font-weight:800;font-size:15px}
.folder .fico{position:absolute;top:10px;right:12px;font-size:18px;opacity:.25}

.doc{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:4px;margin-bottom:8px;background:#fdfefe}
.doc .dico{width:34px;height:34px;border-radius:4px;background:var(--steel-100);display:grid;place-items:center;font-size:15px;flex-shrink:0}
.doc .dn{flex:1;min-width:0}
.doc .dn b{display:block;font-size:12.5px;word-break:break-all}
.doc .dn span{font-size:10.5px;color:var(--steel-500)}

.hidden{display:none!important}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--steel-900);color:#fff;padding:11px 20px;border-radius:5px;font-size:13px;font-weight:600;z-index:99;box-shadow:0 10px 30px -10px rgba(0,0,0,.6);border-left:3px solid var(--signal)}

/* ===== CUSTOMER QUOTATION DOCUMENT ===== */
#printArea{background:#fff}
.q-doc{width:100%;max-width:900px;margin:0 auto;background:#fff;padding:26px;color:#000;font-size:12px}
.q-head{display:flex;border-bottom:3px solid var(--flame);padding-bottom:12px;margin-bottom:14px;gap:14px;align-items:flex-start}
.q-head .l{flex:1}
.q-head h1{margin:0;font-size:26px;letter-spacing:2px;font-weight:800}
.q-head h1 span{color:var(--flame)}
.q-head .tl{font-size:10px;letter-spacing:2.4px;text-transform:uppercase;color:#555;font-weight:700;margin-top:2px}
.q-head .r{text-align:right;font-size:10.5px;line-height:1.6;color:#333}
.q-title{background:#141719;color:#fff;text-align:center;padding:6px;font-size:13px;letter-spacing:3px;font-weight:700;margin-bottom:14px}
.q-meta{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.q-meta .bx{border:1px solid #ccc;padding:9px}
.q-meta .bx h4{margin:0 0 6px;font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:#666;border-bottom:1px solid #eee;padding-bottom:4px}
.q-meta .bx div{font-size:11.5px;margin-bottom:2px}
table.q-tbl{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:12px}
table.q-tbl th{background:#141719;color:#fff;padding:6px;font-size:9.5px;border:1px solid #141719}
table.q-tbl td{border:1px solid #cfd6d9;padding:5px 6px;vertical-align:top}
table.q-tbl tr.grp td{background:#f0f2f3;font-weight:800;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase}
table.q-tbl td.n{text-align:right;font-family:ui-monospace,monospace;white-space:nowrap}
.q-desc{font-size:10px;color:#555;margin-top:2px}
.q-tot{width:340px;margin-left:auto;font-size:12px}
.q-tot div{display:flex;justify-content:space-between;padding:4px 6px;border-bottom:1px solid #e4e8ea}
.q-tot div.gt{background:#141719;color:#fff;font-weight:800;font-size:14px;border:0;padding:8px 6px}
.q-words{border:1px solid #ccc;padding:7px;font-size:11px;margin:10px 0;background:#fafafa}
.q-sec{margin-top:14px}
.q-sec h3{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;background:#e9edee;padding:5px 8px;margin:0 0 7px;border-left:3px solid var(--flame)}
.q-sec ol{margin:0;padding-left:18px;font-size:11px}
.q-sec li{margin-bottom:3px}
.q-bar{color:#fff;text-align:center;padding:5px;font-size:10.5px;letter-spacing:2.2px;font-weight:800;background:#141719;margin-top:14px}
.q-bar.gold{background:#b8860b}
.q-box{border:1px solid #cfd6d9;border-top:0}
.q-box .ln{padding:6px 9px;border-bottom:1px solid #eaeef0;font-size:11px}
.q-box .ln:last-child{border-bottom:0}
.q-box ul{margin:0;padding:8px 8px 8px 26px;font-size:11px}
.q-box ul li{margin-bottom:4px}
table.q-terms{width:100%;border-collapse:collapse;font-size:11px}
table.q-terms td{border:1px solid #cfd6d9;border-top:0;padding:6px 8px;vertical-align:top}
table.q-terms td.lb{width:180px;font-weight:700;background:#fbfcfc}
.q-sign{display:flex;justify-content:space-between;margin-top:26px;font-size:11px}
.q-sign div{width:46%}
.q-sign .ln{border-top:1px solid #333;margin-top:44px;padding-top:4px}
.q-sign .ln b{display:block;font-size:11.5px}
.q-sign .ln span{font-size:10px;color:#555}
.q-foot{margin-top:16px;border-top:2px solid #141719;padding-top:7px;text-align:center;font-size:9.5px;color:#666}

/*MVCSS*/

/* ===== MEGAVERKS sectioned quotation ===== */
.mv-doc{max-width:920px;margin:0 auto;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:11px;padding:14px}
.mv-band{border-bottom:3px solid #1F3A5F;padding-bottom:8px;margin-bottom:8px;text-align:center}
.mv-brand .b1{font-size:22px;font-weight:800;letter-spacing:1px}
.mv-brand .b2{font-size:11px;font-weight:700;color:#B8860B;letter-spacing:1px}
.mv-brand .b3{font-size:8.5px;color:#444;margin-top:3px}
.mv-brand .b4{font-size:8.5px;color:#444;margin-top:2px}
.mv-title{background:#1F3A5F;color:#fff;text-align:center;font-weight:800;letter-spacing:3px;font-size:12px;padding:5px;margin-bottom:8px}
.mv-meta{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:10px}
.mv-meta td{border:1px solid #cfd6d9;padding:4px 6px}
.mv-meta td.k{background:#f0f2f3;font-weight:700;width:110px;white-space:nowrap}
table.mv-tbl{width:100%;border-collapse:collapse;font-size:9.5px}
table.mv-tbl td{border:1px solid #cfd6d9;padding:3px 5px;vertical-align:top}
table.mv-tbl td.c{text-align:center;white-space:nowrap}
table.mv-tbl td.n{text-align:right;font-family:'Courier New',monospace;white-space:nowrap}
table.mv-tbl td.sp{font-size:8.5px;color:#444}
tr.mv-sys td{background:#1F3A5F;color:#fff;font-weight:800;letter-spacing:1.5px;font-size:10px;text-align:center}
tr.mv-sec td{background:#e8edf3;font-weight:800;letter-spacing:.6px;font-size:9.5px}
tr.mv-ch td{background:#33465e;color:#fff;font-weight:700;text-align:center;font-size:8px}
tr.mv-sub td{background:#f6f8f9;font-weight:700;text-align:right}
tr.mv-systot td{background:#dfe5ec;font-weight:800;text-align:right;font-size:10px}
tr.mv-tot td{background:#eef1f3;font-weight:700;text-align:right;font-size:10px}
tr.mv-grand td{background:#1F3A5F;color:#fff;font-weight:800;text-align:right;font-size:12.5px}
.mv-words{border:1px solid #ccc;background:#fafafa;padding:6px;font-size:9.5px;margin:8px 0}
.mv-bar{background:#1F3A5F;color:#fff;font-weight:800;letter-spacing:2px;font-size:9.5px;padding:4px 8px;margin-top:10px}
.mv-bar.gold{background:#B8860B}
.mv-box{border:1px solid #cfd6d9;border-top:0;padding:6px 8px;font-size:9.5px}
.mv-box div{margin-bottom:3px}
.mv-box ul{margin:0;padding-left:18px}
.mv-box li{margin-bottom:2px}
table.mv-terms{width:100%;border-collapse:collapse;font-size:9.5px}
table.mv-terms td{border:1px solid #cfd6d9;border-top:0;padding:5px 8px;vertical-align:top}
table.mv-terms td.tl{width:190px;font-weight:700;background:#fbfcfc}
table.mv-bank{width:100%;border-collapse:collapse;font-size:9.5px}
table.mv-bank td{border:1px solid #cfd6d9;border-top:0;padding:4px 8px}
table.mv-bank td.k{background:#f0f2f3;font-weight:700;width:130px}
table.mv-sign{width:100%;border-collapse:collapse;margin-top:14px;font-size:9.5px}
table.mv-sign td{width:50%;vertical-align:top;padding:6px 8px}
table.mv-sign .sig{height:40px}
table.mv-sign .sl{border-top:1px solid #333;padding-top:3px;font-size:8.5px;color:#555}
.mv-foot{text-align:center;font-size:9px;color:#666;font-style:italic;margin-top:12px;border-top:2px solid #1F3A5F;padding-top:6px}


/* ==================== Interface polish — screen only, print CSS untouched ==================== */
body{background:linear-gradient(180deg,#e9edf2 0,#f3f5f8 260px) fixed}
header{background:linear-gradient(115deg,#0f141c 0%,#1b2431 55%,#13202f 100%);box-shadow:0 8px 28px -14px rgba(0,0,0,.6)}
.logo{border-radius:10px;box-shadow:0 4px 16px -4px rgba(255,122,26,.6);background:linear-gradient(135deg,#ff8a2e,#ff6f08)}
.brand small{color:#a7b6c6}
.crumb{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14)}
nav.tabs{background:rgba(24,30,37,.97);border-bottom:1px solid rgba(0,0,0,.45);box-shadow:0 6px 18px -12px rgba(0,0,0,.5)}
nav.tabs button{border-radius:8px 8px 0 0;margin-top:4px}
nav.tabs button.on{background:#10161d;border-bottom-color:var(--flame)}
.card{border-radius:12px;border:1px solid #e1e7ec;box-shadow:0 1px 2px rgba(16,24,40,.05),0 12px 30px -22px rgba(16,24,40,.28)}
.card>h2{background:linear-gradient(90deg,#1d2733,#12181f);letter-spacing:1.6px;padding:12px 16px}
.btn{border-radius:8px;box-shadow:0 1px 2px rgba(16,24,40,.14);transition:transform .1s ease,box-shadow .15s ease,background .15s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 7px 16px -8px rgba(16,24,40,.4)}
.btn:active{transform:translateY(0);box-shadow:0 1px 2px rgba(16,24,40,.14)}
.btn.pri{background:linear-gradient(135deg,#ff8a2e,#ff6f08);color:#15100a}
.btn.pri:hover{background:linear-gradient(135deg,#ff9a45,#ff7d1c)}
.btn.ok{background:linear-gradient(135deg,#0bd38f,#00b574)}
input,select,textarea{border-radius:8px;border-color:#dde3e9;transition:border-color .15s,box-shadow .15s,background .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--flame);box-shadow:0 0 0 3px rgba(255,122,26,.16);background:#fff}
input:hover,select:hover,textarea:hover{border-color:#c3ccd4}
th{background:#eef2f5}
.item{border-radius:10px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.stat{border-radius:10px;background:linear-gradient(135deg,#1e2835,#11181f);box-shadow:0 6px 16px -10px rgba(16,24,40,.5)}
.readout{border-radius:8px;background:linear-gradient(135deg,#161d24,#0e1318)}
.notebar{border-radius:0 8px 8px 0}
.warnbar{border-radius:0 8px 8px 0}
.folder{border-radius:12px}
.folder:hover{box-shadow:0 16px 34px -18px rgba(0,0,0,.45)}
.chip{letter-spacing:.3px}
.toast{border-radius:10px}
.doc{border-radius:8px}
.internal{border-radius:8px}
::selection{background:rgba(255,122,26,.25)}
nav.tabs::-webkit-scrollbar{height:8px}
nav.tabs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:8px}


/* ==================== Left sidebar navigation ==================== */
#menuBtn{display:none;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:8px;padding:7px 11px;font-size:16px;cursor:pointer}
#scrim2{display:none;position:fixed;inset:0;background:rgba(10,14,18,.55);z-index:55}
@media(min-width:1000px){
  #menuBtn{display:none!important}
  nav.tabs{position:fixed;left:0;top:64px;bottom:0;width:232px;flex-direction:column;align-items:stretch;overflow-y:auto;overflow-x:hidden;padding:10px 9px;z-index:36;background:#181e25;border-bottom:0;border-right:1px solid rgba(0,0,0,.5)}
  nav.tabs button{display:flex;align-items:center;text-align:left;padding:10px 12px;border-radius:8px;border-bottom:0;border-left:3px solid transparent;margin:1px 0;color:#aeb9c6}
  nav.tabs button:hover{background:rgba(255,255,255,.06);color:#fff}
  nav.tabs button.on{border-left-color:var(--flame);border-bottom-color:transparent;background:rgba(255,122,26,.13);color:#fff}

function fleetStats(){
  const done = RECORDS.filter(r=>r&&r.meta&&r.meta.status==='Installation Done');
  const running = RECORDS.filter(r=>r&&r.meta&&r.meta.status==='Won');
  const won = RECORDS.filter(r=>r&&r.meta&&isWon(r.meta.status));
  const eq = {exhB:0, faB:0, exhA:0, faA:0, hoodRft:0};
  won.forEach(r=>{
    (r.units||[]).forEach(u=>{ const q=N(u.qty);
      if(u.type==='AHU'){ if(u.service==='FA') eq.faA+=q; else eq.exhA+=q; }
      else { if(u.service==='FA') eq.faB+=q; else eq.exhB+=q; } });
    (r.hoods||[]).forEach(h=>{ eq.hoodRft+=N(h.rft); });
  });
  return { done, running, won, eq,
    doneVal: done.reduce((s,r)=>s+N(r._total),0),
    runVal: running.reduce((s,r)=>s+N(r._total),0),
    quotedVal: RECORDS.reduce((s,r)=>s+N(r._total),0) };
}
function priceHistory(){
  const hood=[], duct=[], blower=[], ahu=[];
  RECORDS.forEach(r=>{
    (r.hoods||[]).forEach(h=>{ if(N(h.rate)>0) hood.push({d:r.meta.date, v:N(h.rate)}); });
    (r.ducts||[]).forEach(d=>{ if(N(d.rate)>0) duct.push({d:r.meta.date, v:N(d.rate)}); });
    (r.units||[]).forEach(u=>{ if(N(u.rate)>0 && N(u.hp)>0) (u.type==='AHU'?ahu:blower).push({d:r.meta.date, v:N(u.rate)/N(u.hp)}); });
  });
  const s=(a,b)=>String(a.d).localeCompare(String(b.d));
  hood.sort(s); duct.sort(s); blower.sort(s); ahu.sort(s);
  return {hood,duct,blower,ahu};
}
function sparkSVG(pts, color, unit){
  const W=300, H=90, pad=7;
  if(!pts.length) return `<div style="font-size:11px;color:var(--steel-500);padding:16px;text-align:center;border:1px dashed var(--line);border-radius:8px">No data yet — rates from saved quotations draw this trend over time.</div>`;
  const vals=pts.map(p=>p.v), min=Math.min(...vals), max=Math.max(...vals), rng=(max-min)||1;
  const step=pts.length>1?(W-2*pad)/(pts.length-1):0;
  const xy=pts.map((p,i)=>[pad+i*step, pad+(1-(p.v-min)/rng)*(H-2*pad)]);
  const line=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const dots=xy.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" fill="${color}"/>`).join('');
  const first=pts[0], last=pts[pts.length-1];
  const chg=first.v?(last.v-first.v)/first.v*100:0;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="background:#fbfcfd;border:1px solid var(--line);border-radius:8px;display:block">
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2"/>${dots}</svg>
    <div style="font-size:10.5px;color:var(--steel-500);margin-top:4px">${dmy(first.d)} → ${dmy(last.d)} · <b style="color:${color}">₹ ${R0(last.v)}${unit}</b>
    <span style="color:${chg>0?'var(--alert)':chg<0?'var(--ok)':'var(--steel-500)'}">(${chg>0?'+':''}${chg.toFixed(1)}% over ${pts.length} quote${pts.length>1?'s':''})</span> · min ₹ ${R0(min)} / max ₹ ${R0(max)}</div>`;
}

function recItems(r){
  const keep=S; S=normalise(JSON.parse(JSON.stringify(r)));
  const items=[];
  S.hoods.forEach(h=>items.push({cat:'Hood', desc:`${h.type} — ${h.grade}`, qty:N(h.rft), rate:N(h.rate)*(1-N(h.disc)/100), amt:hoodAmt(h)}));
  S.units.forEach(u=>items.push({cat:u.type==='AHU'?'AHU':'Blower',
    desc:`${hpLabel(u)} HP ${u.rpm} RPM — ${u.service==='EXH'?'Exhaust':'Fresh Air'} Line ${u.lineNo} (${N(u.cfm)} CFM)`, qty:N(u.qty), rate:N(u.rate)*(1-N(u.disc)/100), amt:unitAmt(u)}));
  S.ducts.forEach(d=>items.push({cat:'Ducting', desc:`${d.material} ${d.constr} ${d.gauge} — ${d.service==='EXH'?'Exhaust':'Fresh Air'} Line ${d.lineNo} · ${d.w}×${d.h} mm × ${F2(ductRmt(d))} Rmt`, qty:ductSqm(d), rate:N(d.rate)*(1-N(d.disc)/100), amt:ductAmt(d)}));
  if(N(S.extras.install))   items.push({cat:'Installation', desc:'Site installation & commissioning', qty:1, rate:N(S.extras.install), amt:N(S.extras.install)});
  if(N(S.extras.transport)) items.push({cat:'Transport', desc:'Transportation to site', qty:1, rate:N(S.extras.transport), amt:N(S.extras.transport)});
  S.extras.others.forEach(o=>{ if(N(o.amt)) items.push({cat:'Other', desc:o.desc||'Other charges', qty:1, rate:N(o.amt), amt:N(o.amt)}); });
  (S.products||[]).forEach(p=>items.push({cat:'Product', desc:(p.name||'')+(p.model?' — '+p.model:''), qty:N(p.qty), rate:N(p.rate)*(1-N(p.disc)/100), amt:prodAmt(p)}));
  S=keep;
  return items;
}
function quoteCompareHTML(a,b){
  if(!a||!b) return '';
  const itemsA=recItems(a), itemsB=recItems(b);
  const key=(a0,b0)=>[a0.cat,a0.desc].join('|');
  const keys=[...new Set([...itemsA.map(key),...itemsB.map(key)])];
  const find=(arr,k)=>arr.find(x=>key(x)===k);
  const fmt=v=>Math.abs(N(v))<0.005?'—':R0(v);
  const delta=N(b._total)-N(a._total);
  return `<div class="tblwrap" style="margin-top:14px"><table>
    <tr><th rowspan="2" style="vertical-align:bottom">Item</th><th colspan="3">${esc(a.meta.quoteNo)}${N(a.meta.rev)?' REV '+a.meta.rev:''}</th><th colspan="3">${esc(b.meta.quoteNo)}${N(b.meta.rev)?' REV '+b.meta.rev:''}</th><th rowspan="2" style="vertical-align:bottom;text-align:right">Δ amount</th></tr>
    <tr><th>Qty</th><th>Rate</th><th>Amt</th><th>Qty</th><th>Rate</th><th>Amt</th></tr>
    ${keys.map(k=>{ const x=find(itemsA,k), y=find(itemsB,k);
      const amtD=N(y?y.amt:0)-N(x?x.amt:0);
      return `<tr>
        <td style="text-align:left"><b>${esc(k.split('|')[0])}</b> — ${esc(k.split('|')[1])}</td>
        <td>${x?x.qty:''}</td><td>${x?fmt(x.rate):''}</td><td>${x?fmt(x.amt):''}</td>
        <td>${y?y.qty:''}</td><td>${y?fmt(y.rate):''}</td><td>${y?fmt(y.amt):''}</td>
        <td style="text-align:right;color:${Math.abs(amtD)<0.005?'':amtD>0?'var(--alert)':'var(--ok)'};font-weight:700">${Math.abs(amtD)<0.005?'—':(amtD>0?'+':'')+R0(amtD)}</td>
      </tr>`;}).join('')}
    <tr><td style="text-align:left"><b>Total</b></td><td colspan="2"></td><td><b>${R0(a._total)}</b></td><td colspan="2"></td><td><b>${R0(b._total)}</b></td><td style="text-align:right"><b style="color:${delta>0?'var(--alert)':'var(--ok)'}">${delta>0?'+':''}${R0(delta)}</b></td></tr>
  </table></div>
  <div style="font-size:12px;color:var(--steel-500);margin-top:8px">${esc(a.cust.company)} — ${delta>0?'revision B costs more':'revision B costs less'} by ${R0(Math.abs(delta))} (${Math.abs(delta/Math.max(N(a._total),1)*100).toFixed(1)}%).</div>`;
}

async function pinHash(p){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('mhLock::'+p));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function lockSave(){
  LOCK.updated = new Date().toISOString();
  await Store.set('mh_lock', LOCK);
  if(CLOUD.url){ try{ await cloudPost('passkey', { hash:LOCK.hash, on:LOCK.on, updated:LOCK.updated }); }catch(e){} }
}

/* Repair anything saved by an older version or a partial write, so nothing can crash later */
function normalise(r){
  const b = blank();
  r.meta   = Object.assign({}, b.meta, r.meta||{});
  r.cust   = Object.assign({}, b.cust, r.cust||{});
  r.sch    = Object.assign({}, b.sch,  r.sch||{});
  r.bldg   = Object.assign({}, b.bldg, r.bldg||{});
  r.rates  = Object.assign({}, b.rates, r.rates||{});
  r.terms  = Object.assign({}, b.terms, r.terms||{});
  r.print  = Object.assign({format:'megaverks'}, b.print, r.print||{});
  if(r.format && !r.print.format) r.print.format = r.format;   // very old saves kept format outside print
  r.tc     = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_TC)), r.tc||{});
  if(!Array.isArray(r.tc.scopeNotes)) r.tc.scopeNotes = DEFAULT_TC.scopeNotes.slice();
  if(!Array.isArray(r.tc.exclusions)) r.tc.exclusions = DEFAULT_TC.exclusions.slice();
  if(!Array.isArray(r.installPhotos)) r.installPhotos=[];
  if(!Array.isArray(r.lights)) r.lights=[];
  if(typeof r.meta.poNo !== 'string') r.meta.poNo = r.meta.poNo || '';
  if(!Array.isArray(r.payments)){
    r.payments = [];
    if(N(r.meta.paid) > 0) r.payments.push({ id:uid(), date:r.meta.invDate || r.meta.date || '', amount:N(r.meta.paid),
      mode:'', utr:'', note:'Opening balance (migrated)', at:r._saved || new Date().toISOString() });
  }
  if(!Array.isArray(r.tc.terms) || !r.tc.terms.length) r.tc.terms = JSON.parse(JSON.stringify(DEFAULT_TC.terms));
  r.tc.terms = r.tc.terms.filter(x=>x && typeof x==='object').map(x=>({label:x.label||'', text:x.text||''}));
  r.extras = Object.assign({install:0,transport:0,others:[]}, r.extras||{});
  if(!Array.isArray(r.extras.others)) r.extras.others = [];
  ['visits','units','ducts','hoods','filterPlaces','pastWorkLog','products'].forEach(k=>{ if(!Array.isArray(r[k])) r[k]=[]; });
  r.lines = r.lines || {exh:[],fa:[]};
  if(!Array.isArray(r.lines.exh)) r.lines.exh=[];
  if(!Array.isArray(r.lines.fa))  r.lines.fa=[];
  r.units.forEach(u=>{ u.filters = Object.assign({count:0,size:'',micron:'10'}, u.filters||{}); });
  if(!r.id) r.id = uid();
  return r;
}
/* Link every record to a folder named after its customer company */

async function cloudPost(action, payload){
  if(!CLOUD.url) throw new Error('Paste your Web App URL first (Setup → Google Drive sync).');
  const res = await fetch(CLOUD.url, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},   // text/plain avoids the CORS preflight Apps Script cannot answer
    body: JSON.stringify({ action, key: CLOUD.key, payload })
  });
  const d = await res.json();
  if(!d.ok) throw new Error(d.error || 'Upload rejected');
  return d;
}

async function uploadFolder(fid){
  const f = FOLDERS.find(x=>x.id===fid); if(!f) return;
  const qs = folderQuotes(fid);
  if(!qs.length){ toast('No quotations in this folder yet.'); return; }
  const keep = S;
  try{
    await cloudFolder(f);
    for(let i=0;i<qs.length;i++){
      S = normalise(JSON.parse(JSON.stringify(qs[i])));
      toast(`Uploading ${i+1} of ${qs.length}…`);
      const d = await cloudPost('quote', quotePayload(i===0));   // docs ride along once
      CLOUD.lastFolder = d.folder; CLOUD.lastSheet = d.sheet;
    }
    toast(`Folder uploaded — ${qs.length} quotation(s) on Drive.`);
  }catch(e){ toast('Upload failed: ' + e.message); }
  finally{ S = keep; await cloudSave(); render(); }
}

const GAS_SOURCE = `/* MEGAHOODS — Google Drive & Sheets sync endpoint
   ------------------------------------------------------------------
   SETUP (5 minutes, one time):
   1. Go to https://script.google.com and create a New project.
   2. Delete everything in Code.gs and paste this whole file.
   3. Change the SECRET below to your own word/phrase.
   4. Deploy → New deployment → type "Web app" →
      Execute as: Me  ·  Who has access: Anyone  →  Deploy.
   Sheets created in the register: Quotations, Items, Warranty,
   Service Tickets, Past Installations, Installations,
   Record Data & Ticket Data (full records for team sharing —
   any engineer with this URL + SECRET auto-loads everything).
   5. Copy the Web app URL into the app (Setup → Google Drive sync)
      together with the same SECRET, and press "Test connection".
   ------------------------------------------------------------------ */
const SECRET = 'megahoods2026';
const ROOT_NAME = 'MEGAHOODS';
const SHEET_NAME = 'MEGAHOODS Sales Register';

function doGet() {
  return out({ ok: true, msg: 'MEGAHOODS sync endpoint is running. POST from the app to sync.' });
}

function doPost(e) {
  try {
    const req = JSON.parse(e.postData.contents);
    if (req.key !== SECRET) return out({ ok: false, error: 'Wrong secret key' });
    const p = req.payload || {};
    if (req.action === 'ping')         return out(ping_());
    if (req.action === 'quote')        return out(saveQuote_(p));
    if (req.action === 'pull')         return out(pull_());
    if (req.action === 'ticket')       return out(saveTicket_(p));
    if (req.action === 'ticket_delete') return out(deleteTicket_(p));
    return out({ ok: false, error: 'Unknown action: ' + req.action });
  } catch (err) {
    return out({ ok: false, error: String(err && err.message || err) });
  }
}

function out(o) {
  return ContentService.createTextOutput(JSON.stringify(o))
    .setMimeType(ContentService.MimeType.JSON);
}

/* ---------- Drive root & sales register ---------- */
function root_() {
  const it = DriveApp.getFoldersByName(ROOT_NAME);
  return it.hasNext() ? it.next() : DriveApp.createFolder(ROOT_NAME);
}
function register_() {
  const it = DriveApp.getFilesByName(SHEET_NAME);
  let ss;
  if (it.hasNext()) {
    ss = SpreadsheetApp.openById(it.next().getId());
  } else {
    ss = SpreadsheetApp.create(SHEET_NAME);
    DriveApp.getFileById(ss.getId()).moveTo(root_());
  }
  return ss;
}
function sheet_(ss, name, headers) {
  let sh = ss.getSheetByName(name);
  if (!sh) {
    sh = ss.insertSheet(name);
    sh.appendRow(headers);
    sh.getRange(1, 1, 1, headers.length).setFontWeight('bold').setBackground('#1F3A5F').setFontColor('#ffffff');
    sh.setFrozenRows(1);
  }
  return sh;
}
function findRow_(sh, matchFn) {
  const v = sh.getDataRange().getValues();
  for (let i = 1; i < v.length; i++) if (matchFn(v[i])) return i + 1;   // 1-based sheet row
  return 0;
}

function ping_() {
  const ss = register_();
  return { ok: true, msg: 'Connected', sheet: ss.getUrl(), root: root_().getUrl() };
}

/* ---------- Quotation ---------- */
function saveQuote_(p) {
  if (!p.company) return { ok: false, error: 'Missing company name' };

  // 1. customer folder on Drive
  const root = root_();
  const it = root.getFoldersByName(p.company);
  const folder = it.hasNext() ? it.next() : root.createFolder(p.company);

  // 2. the quotation document (formatted HTML — open & print to PDF)
  const fname = (p.quoteNo || 'quote').replace(/\\//g, '-') + (p.rev ? '_REV' + p.rev : '') + '.html';
  const old = folder.getFilesByName(fname);
  while (old.hasNext()) old.next().setTrashed(true);
  const f = folder.createFile(Utilities.newBlob(p.html || '', 'text/html', fname));

  // 3. photos & documents
  (p.photos || []).forEach(function (ph) {
    folder.createFile(Utilities.newBlob(Utilities.base64Decode(ph.data.split(',').pop()), 'image/jpeg', ph.name));
  });
  (p.docs || []).forEach(function (d) {
    const parts = (d.data || '').split(',');
    const mime = (parts[0].match(/data:(.*?);/) || [,'application/octet-stream'])[1];
    folder.createFile(Utilities.newBlob(Utilities.base64Decode(parts.pop()), mime, d.name));
  });

  // 4. sales register — Quotations sheet (upsert by quote no + rev)
  const ss = register_();
  const qsh = sheet_(ss, 'Quotations',
    ['Date','Quote No','Rev','Company','Contact','Phone','Email','Site','Status','Net','GST','Total','Coordinator','Commissioned','Drive Folder','Document']);
  const qrow = findRow_(qsh, function (r) { return r[1] === p.quoteNo && String(r[2]) === String(p.rev); });
  const qvals = [p.date, p.quoteNo, p.rev, p.company, p.contact || '', p.phone || '', p.email || '',
    p.site || '', p.status || '', p.net || 0, p.gstAmt || 0, p.total || 0, p.coordinator || '',
    p.commissioned || '', folder.getUrl(), f.getUrl()];
  if (qrow) qsh.getRange(qrow, 1, 1, qvals.length).setValues([qvals]); else qsh.appendRow(qvals);

  // 5. Items sheet — replace all rows of this quote
  const ish = sheet_(ss, 'Items', ['Quote No','Category','Description','Qty','Unit','Rate','Amount']);
  const iv = ish.getDataRange().getValues();
  for (let i = iv.length - 1; i >= 1; i--) if (iv[i][0] === p.quoteNo) ish.deleteRow(i + 1);
  (p.items || []).forEach(function (x) {
    ish.appendRow([p.quoteNo, x.cat, x.desc, x.qty, x.unit, x.rate, x.amt]);
  });

  // 6. Warranty sheet — replace all rows of this quote
  const wsh = sheet_(ss, 'Warranty', ['Quote No','Company','Category','From','Months','Valid Till','Till ISO']);
  const wv = wsh.getDataRange().getValues();
  for (let j = wv.length - 1; j >= 1; j--) if (wv[j][0] === p.quoteNo) wsh.deleteRow(j + 1);
  (p.warranty || []).forEach(function (w) {
    wsh.appendRow([p.quoteNo, p.company, w.cat, w.from, w.months, w.till, w.tillISO]);
  });


  // 7. Past Installations sheet — customers served earlier (brief, dates, locations)
  if (p.past) {
    const psh = sheet_(ss, 'Past Installations',
      ['Entry No','Registered On','Customer','Location / Address','Site','Contact','Phone','Install Date','Commissioned','Brief','Work Dates & Locations','Blowers Installed','Hood Details','Fresh-Air Filter Places','Warranty Till','Drive Folder']);
    const prow = findRow_(psh, function (r) { return r[0] === p.quoteNo; });
    const wtill = (p.warranty || []).map(function (w) { return w.cat + ': ' + w.till; }).join(' | ');
    const pvals = [p.quoteNo, p.date, p.company, p.address || '', p.site || '', p.contact || '', p.phone || '',
      p.installDate || '', p.commissioned || '', p.pastBrief || '', p.workLog || '',
      p.equipBlowers || '', p.equipHoods || '', p.equipFilters || '', wtill, folder.getUrl()];
    if (prow) psh.getRange(prow, 1, 1, pvals.length).setValues([pvals]); else psh.appendRow(pvals);
  }

  // 8. Installations sheet — quotes marked "Installation Done"
  if (p.status === 'Installation Done') {
    const ish = sheet_(ss, 'Installations',
      ['Quote No','Rev','Company','Site','Location / Address','Commissioned','Install Date','Total','Coordinator','Updated','Drive Folder']);
    const irow = findRow_(ish, function (r) { return r[0] === p.quoteNo && String(r[1]) === String(p.rev); });
    const ivals = [p.quoteNo, p.rev, p.company, p.site || '', p.address || '', p.commissioned || '',
      p.installDate || '', p.total || 0, p.coordinator || '', new Date().toLocaleString('en-IN'), folder.getUrl()];
    if (irow) ish.getRange(irow, 1, 1, ivals.length).setValues([ivals]); else ish.appendRow(ivals);
  }

  // 9. Record Data sheet — full record JSON so teammates can pull everything
  if (p.record) {
    const rsh = sheet_(ss, 'Record Data', ['Key','Updated','Record JSON']);
    const key = p.quoteNo + '_' + p.rev;
    const rrow = findRow_(rsh, function (r) { return r[0] === key; });
    const rvals = [key, new Date().toISOString(), JSON.stringify(p.record)];
    if (rrow) rsh.getRange(rrow, 1, 1, rvals.length).setValues([rvals]); else rsh.appendRow(rvals);
  }

  return { ok: true, folder: folder.getUrl(), pdf: f.getUrl(), sheet: ss.getUrl() };
}

/* ---------- Team pull: everything stored, for any engineer opening the app ---------- */
function pull_() {
  const ss = register_();
  const out_ = { ok: true, records: [], tickets: [], sheet: ss.getUrl() };
  const rsh = ss.getSheetByName('Record Data');
  if (rsh) {
    const v = rsh.getDataRange().getValues();
    for (let i = 1; i < v.length; i++) if (v[i][2]) out_.records.push(v[i][2]);
  }
  const tsh = ss.getSheetByName('Ticket Data');
  if (tsh) {
    const tv = tsh.getDataRange().getValues();
    for (let j = 1; j < tv.length; j++) if (tv[j][1]) out_.tickets.push(tv[j][1]);
  }
  return out_;
}

/* ---------- After-sales service tickets ---------- */
function saveTicket_(p) {
  const ss = register_();
  const sh = sheet_(ss, 'Service Tickets',
    ['Ticket No','Date','Company','Site','Contact','Phone','Category','Issue','Priority','Technician','Scheduled','Status','Resolution','Next Due','Closed']);
  const row = findRow_(sh, function (r) { return r[0] === p.no; });
  const vals = [p.no, p.created || '', p.company || '', p.site || '', p.contact || '', p.phone || '',
    p.cat || '', p.issue || '', p.priority || '', p.tech || '', p.sched || '', p.status || '',
    p.resolution || '', p.nextDue || '', p.closed || ''];
  if (row) sh.getRange(row, 1, 1, vals.length).setValues([vals]); else sh.appendRow(vals);
  if (p.full) {
    const tsh = sheet_(ss, 'Ticket Data', ['Ticket No','Ticket JSON']);
    const trow = findRow_(tsh, function (r) { return r[0] === p.no; });
    const tvals = [p.no, JSON.stringify(p.full)];
    if (trow) tsh.getRange(trow, 1, 1, tvals.length).setValues([tvals]); else tsh.appendRow(tvals);
  }
  return { ok: true, sheet: ss.getUrl() };
}
function deleteTicket_(p) {
  const ss = register_();
  const sh = ss.getSheetByName('Service Tickets');
  if (sh) {
    const row = findRow_(sh, function (r) { return r[0] === p.no; });
    if (row) sh.deleteRow(row);
  }
  const tsh = ss.getSheetByName('Ticket Data');
  if (tsh) {
    const trow = findRow_(tsh, function (r) { return r[0] === p.no; });
    if (trow) tsh.deleteRow(trow);
  }
  return { ok: true };
}

/* Team sharing: pull every quotation & ticket stored on the Drive register and merge locally */
async function pullFromGoogle(show){
  if(!CLOUD.url){ if(show!==false) toast('Paste your Web App URL first (Setup → Google Drive sync).'); return; }
  try{
    const d = await cloudPost('pull', {});
    let nf=0, nr=0, nt=0;
    (d.folders||[]).forEach(j=>{
      try{
        const fo = typeof j==='string'?JSON.parse(j):j; if(!fo || !fo.company) return;
        if(!Array.isArray(fo.docs)) fo.docs=[];
        if(!Array.isArray(fo.drawings)) fo.drawings=[];
        (fo.drawingsMeta||[]).forEach(m=>{ if(!fo.drawings.some(x=>x.id===m.id)) fo.drawings.push(Object.assign({data:''},m)); });
        delete fo.drawingsMeta;
        const i = FOLDERS.findIndex(x=>x.id===fo.id || x.company.toLowerCase()===String(fo.company).toLowerCase());
        if(i<0){ FOLDERS.push(fo); nf++; }
        else{
          const keepDocs=FOLDERS[i].docs||[], keepDraw=FOLDERS[i].drawings||[];
          FOLDERS[i]=Object.assign({}, FOLDERS[i], fo);
          // never lose locally-held files that the remote copy lacks
          keepDocs.forEach(dc=>{ if(!FOLDERS[i].docs.some(x=>x.name===dc.name)) FOLDERS[i].docs.push(dc); });
          keepDraw.forEach(dw=>{ if(dw.data && !FOLDERS[i].drawings.some(x=>x.id===dw.id && x.data)) FOLDERS[i].drawings.push(dw); });
          nf++;
        }
      }catch(e){}
    });
    await Store.set('mh_folders', FOLDERS);
    (d.records||[]).forEach(j=>{
      try{
        const rec = normalise(typeof j==='string'?JSON.parse(j):j);
        const i = RECORDS.findIndex(x=>x.id===rec.id || (x.meta.quoteNo===rec.meta.quoteNo && N(x.meta.rev)===N(rec.meta.rev)));
        if(i<0){ RECORDS.push(rec); nr++; }
        else if(String(rec._saved||'') >= String(RECORDS[i]._saved||'')){ RECORDS[i]=rec; nr++; }
      }catch(e){}
    });
    (d.tickets||[]).forEach(j=>{
      try{
        const tk = typeof j==='string'?JSON.parse(j):j; if(!tk.no) return;
        const i = TICKETS.findIndex(x=>x.no===tk.no);
        if(i<0){ TICKETS.push(tk); nt++; } else { TICKETS[i]=tk; nt++; }
      }catch(e){}
    });
    (d.payments||d.pay||[]).forEach(j=>{
      try{
        const p = typeof j==='string'?JSON.parse(j):j; if(!p || !p.id) return;
        const r = RECORDS.find(x=>x.meta.quoteNo===p.quoteNo && N(x.meta.rev)===N(p.rev||0)) || RECORDS.find(x=>x.meta.quoteNo===p.quoteNo);
        if(!r) return;
        r.payments = Array.isArray(r.payments) ? r.payments : [];
        const i = r.payments.findIndex(x=>x.id===p.id);
        if(i<0) r.payments.push(p); else r.payments[i]=p;
        r.meta.paid = paidTotal(r);
      }catch(e){}
    });
    if(d.settings && d.settings.passkey && d.settings.passkey.hash){
      const rp = d.settings.passkey;
      if(String(rp.updated||'') >= String(LOCK.updated||'')){
        LOCK = { on: rp.on!==false, hash: rp.hash, updated: rp.updated||LOCK.updated };
        await Store.set('mh_lock', LOCK);
      }
    }
    RECORDS.forEach(normalise);
    migrate();
    await saveAll();
    if(show!==false) toast('Pulled from Google — '+nf+' folder(s), '+nr+' quotation(s), '+nt+' ticket(s) up to date.');
    render();
  }catch(e){ if(show!==false) toast('Pull failed: ' + e.message); }
}

/* ---------- HOSTINGER SERVER BACKUP ---------- */
async function hostSave(){ await Store.set('mh_host', HOST); }
async function hostPost(action, payload){
  if(!HOST.url) throw new Error('Paste your server URL first (Setup → Server backup).');
  const res = await fetch(HOST.url, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action, key: HOST.key, payload })
  });
  let d;
  try{ d = await res.json(); }
  catch(e){ throw new Error('Server did not return JSON (HTTP ' + res.status + '). Check the URL.'); }
  if(!d.ok) throw new Error(d.error || 'Rejected by server');
  return d;
}
async function hostPing(){
  try{
    toast('Contacting your server…');
    const d = await hostPost('ping', {});
    HOST.last = `${d.msg} · MySQL ${d.mysql} · ${d.customers} customer(s), ${d.quotations} quotation(s) stored`;
    await hostSave(); render(); toast('Server connected.');
  }catch(e){ HOST.last = 'Failed: ' + e.message; await hostSave(); render(); toast('Connection failed: ' + e.message); }
}

async function backupFolderToServer(fid){
  const qs = folderQuotes(fid);
  if(!qs.length){ toast('No quotations in this folder.'); return; }
  const keep = S;
  try{
    for(let i=0;i<qs.length;i++){
      S = normalise(JSON.parse(JSON.stringify(qs[i])));
      toast(`Backing up ${i+1} of ${qs.length}…`);
      const P = quotePayload(false);
      P.record = JSON.parse(JSON.stringify(S));
      delete P.photos; delete P.docs;
      await hostPost('quote', P);
      const company = safeName(S.cust.company);
      const photos = S.visits.flatMap((v,i)=>visitPhotos(v).map((p,pi)=>({name:`visit${i+1}_${pi+1}_${v.date||'nodate'}.jpg`, data:p})));
      (S.installPhotos||[]).forEach((p,pi)=>photos.push({name:`${S.meta.quoteNo.replace(/\//g,'-')}_install_${pi+1}.jpg`, data:p}));
      for(let j=0;j<photos.length;j++)
        await hostPost('file', { company, kind:'photo', name:photos[j].name, data:photos[j].data });
    }
    const f = FOLDERS.find(x=>x.id===fid);
    for(const d of (f?f.docs:[]))
      await hostPost('file', { company:safeName(f.company), kind:'doc', tag:d.tag, name:d.name, data:d.data });
    for(const d of (f&&f.drawings||[]))
      await hostPost('file', { company:safeName(f.company), kind:'drawing', tag:d.cat, name:d.name, data:d.data });
    toast(`Folder backed up — ${qs.length} quotation(s).`);
  }catch(e){ toast('Backup failed: ' + e.message); }
  finally{ S = keep; render(); }
}
/* pull everything back onto a new laptop / phone / cleared browser */
async function restoreFromServer(){

/* ---------- HELPERS ---------- */
const R  = n => '₹ ' + (Math.round((+n||0)*100)/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const R0 = n => '₹ ' + Math.round(+n||0).toLocaleString('en-IN');
const N  = n => (+n||0);
const F2 = n => (Math.round((+n||0)*100)/100).toFixed(2);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dmy = d => d ? new Date(d).toLocaleDateString('en-IN') : '—';
const safeName = s => String(s||'Customer').replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,' ').trim();
const safeURL = u => /^https?:\/\//i.test(String(u||'').trim()) ? String(u).trim() : '';
function toast(m){ const d=document.createElement('div'); d.className='toast'; d.textContent=m; document.body.appendChild(d); setTimeout(()=>d.remove(),2800); }

function words(n){
  n = Math.round(n||0); if(!n) return 'Zero Rupees Only';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two = x => x<20 ? a[x] : b[Math.floor(x/10)] + (x%10 ? ' '+a[x%10] : '');
  const three = x => (x>99 ? a[Math.floor(x/100)]+' Hundred'+(x%100?' ':'') : '') + (x%100 ? two(x%100) : '');
  let s='', cr=Math.floor(n/10000000); n%=10000000;
  let lk=Math.floor(n/100000); n%=100000; let th=Math.floor(n/1000); n%=1000;
  if(cr) s+=three(cr)+' Crore '; if(lk) s+=three(lk)+' Lakh '; if(th) s+=three(th)+' Thousand '; if(n) s+=three(n);
  return s.trim()+' Rupees Only';
}
/* {GST}, {VALIDITY} … keep the terms in step with the numbers on the quote */
function tok(str){
  const g = N(S.rates.gst);
  const map = {
    '{GST}': g, '{GST_HALF}': (g/2 % 1 ? (g/2).toFixed(1) : g/2),
    '{VALIDITY}': N(S.meta.validity),
    '{WARRANTY}': N(S.rates.wBlower), '{WARRANTY_BLOWER}': N(S.rates.wBlower), '{WARRANTY_HOOD}': N(S.rates.wHood),
    '{COMPANY}': S.cust.company || '—', '{SITE}': S.cust.site || '—',
    '{START}': dmy(S.sch.start), '{END}': dmy(S.sch.end),
    '{COORDINATOR}': S.meta.coName || '—', '{PHONE}': S.meta.coPhone || '—',
    '{QUOTENO}': S.meta.quoteNo || '—'
  };
  return String(str||'').replace(/\{[A-Z_]+\}/g, m => (m in map ? map[m] : m));
}

function set(path,val){ const p=path.split('.'); let o=S; for(let i=0;i<p.length-1;i++) o=o[p[i]]; o[p[p.length-1]]=val; }
function bind(path,type='text',extra=''){

  const q = type==='number' ? `onchange="set('${path}', +this.value); render()"` : `onchange="set('${path}', this.value); render()"`;

/* ---------- CALCS ---------- */
function lineList(){
  const o=[];
  S.lines.exh.forEach(l=>o.push({k:'EXH'+l.no,s:'EXH',no:l.no,name:l.name,label:`Exhaust Line ${l.no}${l.name?' — '+l.name:''}`,cfm:N(l.cfm)}));
  S.lines.fa .forEach(l=>o.push({k:'FA'+l.no, s:'FA', no:l.no,name:l.name,label:`Fresh Air Line ${l.no}${l.name?' — '+l.name:''}`,cfm:N(l.cfm)}));
  return o;
}
const lineCFM = (s,no) => { const L=(s==='EXH'?S.lines.exh:S.lines.fa).find(x=>x.no==no); return L?N(L.cfm):0; };
const blowerLookup = (hp,rpm) => BLOWER_MASTER.find(b=>b.hp==hp && b.rpm==rpm) || null;

/* "Other" HP must print the value the coordinator typed, not the word "Other" */
const hpLabel = u => (u.hp==='Other' ? (String(u.hpCustom||'').trim() || '—') : u.hp);
const unitAmt  = u => N(u.qty)*N(u.rate)*(1-N(u.disc)/100);
const unitList = u => N(u.qty)*N(u.rate);
function unitCost(u){ if(u.type!=='BLOWER') return N(u.costEach)*N(u.qty); const m=blowerLookup(u.hp,u.rpm); return m?m.cost*N(u.qty):N(u.costEach)*N(u.qty); }

const ductSqm  = d => ((N(d.w)+N(d.h))*2*N(d.len))/1000000;
const ductRmt  = d => N(d.len)/1000;
const ductRft  = d => ductRmt(d)*3.280839895;
const ductAmt  = d => ductSqm(d)*N(d.rate)*(1-N(d.disc)/100);
const ductList = d => ductSqm(d)*N(d.rate);
function ductVel(d){
  const cfm=lineCFM(d.service,d.lineNo), aM2=(N(d.w)/1000)*(N(d.h)/1000);
  if(!aM2||!cfm) return {fpm:0,mps:0};
  return { fpm: cfm/(aM2*10.7639), mps: (cfm*0.000471947)/aM2 };
}
function velStatus(f){
  if(!f) return {c:'grey',t:'—'};
  if(f<1200) return {c:'warn',t:'Low — grease may settle'};
  if(f<=2200) return {c:'ok',t:'Ideal (1200–2200 fpm)'};
  if(f<=2800) return {c:'warn',t:'High — noise likely'};
  return {c:'bad',t:'Too high — resize duct'};
}
function hoodRate(h){ const m=HOOD_MASTER.find(x=>x.t===h.type); if(!m) return N(h.rate); return h.grade==='SS 202'? m.r-SS202_LESS : m.r; }
const hoodAmt  = h => N(h.rft)*N(h.rate)*(1-N(h.disc)/100);
const hoodList = h => N(h.rft)*N(h.rate);

const prodAmt = p => N(p.qty)*N(p.rate)*(1-N(p.disc)/100);
const prodList = p => N(p.qty)*N(p.rate);
function totals(){
  const t={unitL:0,unitN:0,unitC:0,ductL:0,ductN:0,hoodL:0,hoodN:0,prodL:0,prodN:0,extra:0};
  S.units.forEach(u=>{t.unitL+=unitList(u);t.unitN+=unitAmt(u);t.unitC+=unitCost(u);});
  S.ducts.forEach(d=>{t.ductL+=ductList(d);t.ductN+=ductAmt(d);});
  S.hoods.forEach(h=>{t.hoodL+=hoodList(h);t.hoodN+=hoodAmt(h);});
  (S.products||[]).forEach(x=>{t.prodL+=prodList(x);t.prodN+=prodAmt(x);});
  t.extra=N(S.extras.install)+N(S.extras.transport)+S.extras.others.reduce((s,o)=>s+N(o.amt),0);
  t.list=t.unitL+t.ductL+t.hoodL+t.prodL+t.extra;
  t.net=t.unitN+t.ductN+t.hoodN+t.prodN+t.extra;
  t.disc=t.list-t.net; t.discPct=t.list?(t.disc/t.list*100):0;
  t.gst=t.net*N(S.rates.gst)/100; t.grand=t.net+t.gst;
  return t;
}
function balance(){
  return lineList().map(L=>{
    const inst=S.units.filter(u=>u.service===L.s&&u.lineNo==L.no).reduce((s,u)=>s+N(u.cfm)*N(u.qty),0);
    const dev=L.cfm?((inst-L.cfm)/L.cfm*100):0;
    let st='grey',msg='No blower assigned';
    if(inst&&L.cfm){ if(dev<-5){st='bad';msg='Under-sized — upsize blower';} else if(dev>25){st='warn';msg='Over-sized — check damper/noise';} else {st='ok';msg='Balanced';} }
    else if(inst&&!L.cfm){st='warn';msg='Enter line CFM';}
    return {...L,inst,dev,st,msg};
  });
}

function docUpload(inp,fid){
  const files = [...inp.files]; if(!files.length) return;
  const f = FOLDERS.find(x=>x.id===fid); if(!f) return;
  let done = 0;
  files.forEach(file=>{
    const r = new FileReader();
    r.onload = e => {
      const push = data => {
        f.docs.unshift({ id:uid(), name:file.name, type:file.type||'file', tag:'Site photo',
                         date:new Date().toISOString().slice(0,10), size:Math.round(data.length*0.75/1024), data });
        if(++done===files.length){ Store.set('mh_folders',FOLDERS); render(); toast(`${files.length} file(s) stored in ${f.company}.`); }
      };
      if((file.type||'').startsWith('image/')){
        const img = new Image();
        img.onload = () => {
          const c=document.createElement('canvas'), sc=Math.min(1,1200/img.width);
          c.width=img.width*sc; c.height=img.height*sc;
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          push(c.toDataURL('image/jpeg',0.72));
        };
        img.src = e.target.result;
      } else push(e.target.result);
    };
    r.readAsDataURL(file);
  });
}

Contact person : ${f.info.name||'-'}

    r.visits.forEach((v,i)=>{

                          p.split(',')[1], {base64:true}));
    });

  const ipf = root.folder('Installation photos');

    (r.installPhotos||[]).forEach((p,pi)=>{
      const b64=(p||'').split(',')[1];
      if(b64) ipf.file(`${r.meta.quoteNo.replace(/\//g,'-')}_install_${pi+1}.jpg`, b64, {base64:true});
    });
  });

  // service ticket photos for this customer
  const spf = root.folder('Service photos');

  const df = root.folder('Documents');
  f.docs.forEach(d=>{
    const t = df.folder(safeName(d.tag||'Other'));
    const b64 = (d.data||'').split(',')[1];
    if(b64) t.file(d.name, b64, {base64:true});
  });

  const blob = await zip.generateAsync({type:'blob'});
  const a=document.createElement('a');

  const c = COST.hood;
  const areaSqm = ((2*(N(c.h)+N(c.d)) + N(c.d)) / 1000) * 0.3048;   // two sides + front face per rft of length
  const density = c.grade==='SS 202' ? 7800 : 8000;                  // kg/m³
  const kg = areaSqm * N(c.gauge) * density / 1000;
  const mat = kg * N(c.ssRate);
  const filt = N(c.filtersPerRft) * N(c.filterRate);
  const sub = mat + filt + N(c.labour);
  const cons = sub * N(c.consumables)/100;
  const ovh = (sub+cons) * N(c.overhead)/100;
  const cost = sub+cons+ovh;
  const price = cost * (1 + N(c.profit)/100);
  return {kg, mat, filt, sub, cons, ovh, cost, price};
}
function ductCostCalc(){
  const c = COST.duct;
  const kg = N(c.gauge)*7.85 * (1 + N(c.wastage)/100);               // 1 mm GI ≈ 7.85 kg/m²
  const mat = kg * N(c.giRate);
  const sub = mat + N(c.hardware) + N(c.labour);
  const ovh = sub * N(c.overhead)/100;
  const cost = sub+ovh;
  const price = cost * (1 + N(c.profit)/100);
  return {kg, mat, sub, ovh, cost, price};
}
function blowerCostCalc(r){
  const sub = N(r.motor) + N(r.steelKg)*N(r.steelRate) + N(r.fab);
  const ovh = sub * N(COST.blower.overhead)/100;
  const cost = sub+ovh;
  const price = cost * (1 + N(COST.blower.profit)/100);
  return {sub, ovh, cost, price};
}

function exportCostXLSX(){
  if(typeof XLSX==='undefined'){ toast('Excel export needs an internet connection the first time.'); return; }
  if(!COST) COST = COST_DEFAULT();
  const H=hoodCostCalc(), D=ductCostCalc();
  const wb=XLSX.utils.book_new();
  const mk=(name, aoa)=>XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), name);
  mk('Hood', [['MEGAHOODS — HOOD COSTING / rft'],[],
    ['Height (mm)',N(COST.hood.h)],['Depth (mm)',N(COST.hood.d)],['Grade',COST.hood.grade],['Thickness (mm)',N(COST.hood.gauge)],
    ['Sheet rate ₹/kg',N(COST.hood.ssRate)],['Labour ₹/rft',N(COST.hood.labour)],['Filters/rft',N(COST.hood.filtersPerRft)],
    ['Filter ₹ each',N(COST.hood.filterRate)],['Consumables %',N(COST.hood.consumables)],['Overhead %',N(COST.hood.overhead)],['Profit %',N(COST.hood.profit)],[],
    ['Sheet kg/rft',+F2(H.kg)],['Material',Math.round(H.mat)],['Filters',Math.round(H.filt)],['Consumables',Math.round(H.cons)],
    ['Overhead',Math.round(H.ovh)],['FACTORY COST',Math.round(H.cost)],['PRICE /rft',Math.round(H.price)]]);
  mk('Duct', [['MEGAHOODS — DUCT COSTING / sqm'],[],
    ['GI thickness (mm)',N(COST.duct.gauge)],['GI rate ₹/kg',N(COST.duct.giRate)],['Wastage %',N(COST.duct.wastage)],
    ['Hardware ₹/sqm',N(COST.duct.hardware)],['Fabrication ₹/sqm',N(COST.duct.labour)],['Overhead %',N(COST.duct.overhead)],['Profit %',N(COST.duct.profit)],[],
    ['Sheet kg/sqm',+F2(D.kg)],['Material',Math.round(D.mat)],['Overhead',Math.round(D.ovh)],['FACTORY COST',Math.round(D.cost)],['PRICE /sqm',Math.round(D.price)]]);
  mk('Blower', [['MEGAHOODS — BLOWER/AHU COSTING'],[],
    ['HP','Motor','Steel kg','Steel ₹/kg','Fabrication','Cost','Price'].slice(0,7),
    ...COST.blower.rows.map(r=>{ const c=blowerCostCalc(r); return [N(r.hp),N(r.motor),N(r.steelKg),N(r.steelRate),N(r.fab),Math.round(c.cost),Math.round(c.price)]; })]);
  XLSX.writeFile(wb, 'MEGAHOODS_costing.xlsx');
  toast('Costing sheet exported.');
}

  return { ex, fa: rows.length-ex, units, custs, lb, max: lb.length?lb[0][1].n:1 };

function vFolders(){
  if(OPEN_FOLDER) return vFolderDetail(OPEN_FOLDER);
  return `
  <div class="card"><h2>MEGAVENTS — how the system breathes <span class="tag">live diagram</span></h2><div class="body">
    <div class="notebar">Cooking fumes rise into the exhaust hood (red) while the ceiling diffuser washes the kitchen with fresh air (green) — chef included. This is exactly what every quotation in this app engineers.</div>
    <div class="scene-wrap">${SCENE_SVG}</div>
  </div></div>
  <div class="card"><h2>Customer folders <span class="tag">${FOLDERS.length} folder(s) · one per customer company</span></h2><div class="body">
    <div class="notebar">Every quotation, site-visit photo and uploaded document is filed under the customer's company name. Save a quotation and its folder is created automatically.</div>
    <div class="btnrow" style="margin-bottom:14px">
      <button class="btn pri" onclick="createFolder()">📁 Create folder</button>
      <button class="btn ghost" onclick="exportJSON()">⬇ Backup everything</button>
    </div>
    ${FOLDERS.length ? `<div class="folders">${FOLDERS.map(f=>{
      const q = folderQuotes(f.id), won = q.filter(r=>isWon(r.meta.status)).length;
      return `<div class="folder" onclick="openFolder('${f.id}')">
        <div class="fico">📁</div>
        <div class="fname">${esc(f.company)}</div>
        <div class="fsite">${esc(f.info.site||'—')}</div>
        <div class="fmeta">
          <span class="chip grey">${q.length} quote${q.length===1?'':'s'}</span>
          <span class="chip grey">${f.docs.length} doc${f.docs.length===1?'':'s'}</span>
          ${won?`<span class="chip ok">${won} won</span>`:''}
        </div>
        <div class="fval">${R0(folderValue(f.id))}</div>
      </div>`;}).join('')}</div>`
    : `<div class="warnbar">No folders yet. Create one, or just save a quotation — the folder is made from the customer company name.</div>`}
  </div></div>`;
}

function vFolderDetail(id){
  const f = FOLDERS.find(x=>x.id===id);
  if(!f){ OPEN_FOLDER=''; return vFolders(); }
  const q = folderQuotes(id);
  const visits = q.flatMap(r=>r.visits.map(v=>({...v, qn:r.meta.quoteNo})));
  return `
  <div class="card"><h2>📁 ${esc(f.company)} <span class="tag">Folder created ${dmy(f.createdAt)}</span></h2><div class="body">
    <div class="btnrow" style="margin-bottom:14px">

    <div class="grid g4">
      <div class="stat"><span>Quotations</span><b>${q.length}</b></div>
      <div class="stat"><span>Folder value</span><b>${R0(folderValue(id))}</b></div>
      <div class="stat"><span>Documents</span><b>${f.docs.length}</b></div>
      <div class="stat"><span>Site visits</span><b>${visits.length}</b></div>
    </div>
  </div></div>

  <div class="card"><h2>Folder tree <span class="tag">Every entry under this customer</span></h2><div class="body">
    ${folderTreeHTML(f,q)}
  </div></div>

  <div class="card"><h2>Customer card</h2><div class="body">
    <div class="grid g4">
      <div><label>Contact person</label><input value="${esc(f.info.name||'')}" onchange="fset('${id}','name',this.value)"></div>

      <div><label>GSTIN</label><input value="${esc(f.info.gst||'')}" onchange="fset('${id}','gst',this.value)"></div>
    </div>
    <div class="grid g3" style="margin-top:12px">
      <div><label>Site</label><input value="${esc(f.info.site||'')}" onchange="fset('${id}','site',this.value)"></div>
      <div><label>Address</label><textarea onchange="fset('${id}','address',this.value)">${esc(f.info.address||'')}</textarea></div>

    </div>
    <div style="margin-top:12px"><label>Folder notes</label>

  </div></div>`:''}

  <div class="card"><h2>Documents in this folder <span class="tag">Photos, POs, drawings, invoices</span></h2><div class="body">

async function installPhotoAdd(rid,input){
  const r=RECORDS.find(x=>x.id===rid); if(!r) return;

  ['civil','Civil layout','.pdf,.dwg'],

  ['electrical','Electrical layout','.pdf,.dwg'],

function dwgList(f,cat){ return (f.drawings||[]).map((d,i)=>({d,i})).filter(x=>x.d.cat===cat); }
async function dwgUpload(input,fid,cat){
  const f=FOLDERS.find(x=>x.id===fid); if(!f) return;
  const files=[...(input.files||[])]; if(!files.length) return;
  if(!Array.isArray(f.drawings)) f.drawings=[];
  let added=0;
  for(const file of files){
    const data=await new Promise(res=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=()=>res(null); r.readAsDataURL(file); });
    if(!data) continue;
    f.drawings.push({ id:uid(), cat, name:file.name, type:file.type||'', size:Math.round(file.size/1024),
      date:new Date().toISOString().slice(0,10), data });
    added++;
    if(cloudOn()){
      try{ await cloudPost('drawing', { company:f.company, cat, name:file.name, data }); }catch(e){}
    }
  }
  await Store.set('mh_folders',FOLDERS); render();
  if(cloudOn()) cloudFolder(f);
  toast(added+' drawing file(s) filed under '+f.company+'.');
}
async function dwgDel(fid,i){
  const f=FOLDERS.find(x=>x.id===fid); if(!f||!f.drawings) return;
  if(!confirm('Delete drawing '+f.drawings[i].name+'?')) return;
  f.drawings.splice(i,1); await Store.set('mh_folders',FOLDERS); render();
}
function dwgOpen(fid,i){
  const f=FOLDERS.find(x=>x.id===fid); const d=f&&f.drawings&&f.drawings[i]; if(!d) return;
  const ext=(d.name.split('.').pop()||'').toLowerCase();
  const a=document.createElement('a');
  a.href=d.data;
  if(ext==='pdf'||['png','jpg','jpeg'].includes(ext)){ a.target='_blank'; a.href=d.data; }
  else a.download=d.name;                       // dwg / dxf -> download
  document.body.appendChild(a); a.click(); a.remove();
}

function exportAll(){
  const dump = {
    app:'MEGAHOODS-quotation-system', v:1,
    exported:new Date().toISOString(),
    data:{
      mh_folders:FOLDERS, mh_records:RECORDS, mh_tickets:TICKETS,
      mh_terms:TPL, mh_profile:PROFILE, mh_cloud:CLOUD, mh_host:HOST,
      mh_masters:{blowers:BLOWER_MASTER, hoods:HOOD_MASTER, unitTypes:UNIT_TYPES, otherProducts:OTHER_PRODUCTS, starters:STARTER_MASTER},
      mh_annex:ANNEX, mh_lock:LOCK, mh_leads:LEADS
    }
  };
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(dump)],{type:'application/json'}));
  a.download='MEGAHOODS_backup_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},600);
  toast('Full backup downloaded — keep it safe. Restore it after any app update.');
}
async function importAll(input){
  const f=input.files && input.files[0]; if(!f) return;
  const txt=await f.text();
  let dump; try{ dump=JSON.parse(txt); }catch(e){ toast('That file is not a valid backup.'); return; }
  if(!dump || dump.app!=='MEGAHOODS-quotation-system' || !dump.data){ toast('That file is not a MEGAHOODS backup.'); return; }
  if(!confirm('Restore backup from '+(dump.exported||'').slice(0,10)+'?\n\nThis REPLACES all current data in the app (folders, quotations, tickets, drawings, settings).')) return;
  const d=dump.data;
  for(const k of ['mh_folders','mh_records','mh_tickets','mh_terms','mh_profile','mh_cloud','mh_host','mh_masters','mh_annex','mh_lock','mh_leads']){
    if(d[k]!==undefined && d[k]!==null) await Store.set(k,d[k]);
  }
  toast('Backup restored — reloading…');
  setTimeout(()=>location.reload(),800);
}

          <div><label>Site photos (select many)</label><input type="file" accept="image/*" multiple onchange="visitPhoto(this,${i})"></div>
          <div style="grid-column:span 3;display:flex;flex-wrap:wrap;gap:8px">
            ${visitPhotos(v).length ? visitPhotos(v).map((p,pi)=>`<span style="position:relative;display:inline-block"><img class="photo" src="${p}"><button class="btn dan sm" style="position:absolute;top:4px;right:4px;padding:2px 7px" title="Remove photo" onclick="visitPhotoDel(${i},${pi})">×</button></span>`).join('') : `<div class="photo" style="display:grid;place-items:center;color:var(--steel-500);font-size:12px">No photos uploaded</div>`}
          </div>
        </div>
        <div style="margin-top:8px"><label>Observations</label><textarea onchange="S.visits[${i}].obs=this.value">${esc(v.obs||'')}</textarea></div>
      </div>`).join('') : `<div class="warnbar">No visits logged yet.</div>`}
    </div>
  </div></div>`;
}
function filesToPhotos(input,maxW,qual){
  const files=[...(input.files||[])]; if(!files.length) return Promise.resolve([]);
  return Promise.all(files.map(f=>new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>{ const img=new Image();
      img.onload=()=>{ const sc=Math.min(1,maxW/Math.max(img.width,img.height));
        const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.width*sc)); c.height=Math.max(1,Math.round(img.height*sc));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',qual)); };
      img.onerror=()=>res(null);
      img.src=e.target.result; };
    r.onerror=()=>res(null);
    r.readAsDataURL(f);
  }))).then(a=>a.filter(x=>x));
}
const visitPhotos = v => (v.photos && v.photos.length) ? v.photos : (v.photo ? [v.photo] : []);
function addVisit(){ S.visits.push({date:'',by:S.meta.coName,purpose:'',photos:[],obs:''}); render(); }
function visitPhoto(inp,i){
  const files=[...inp.files]; if(!files.length) return;
  const v=S.visits[i]; if(!v.photos) v.photos=visitPhotos(v);
  let done=0;
  files.forEach(f=>{
    const r=new FileReader();
    r.onload = e => { const img=new Image();
      img.onload = () => { const c=document.createElement('canvas'), sc=Math.min(1,900/img.width);
        c.width=Math.max(1,Math.round(img.width*sc)); c.height=Math.max(1,Math.round(img.height*sc));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        v.photos.push(c.toDataURL('image/jpeg',0.72));
        if(++done===files.length){ render(); toast(files.length+' photo(s) attached.'); } };
      img.src=e.target.result; };
    r.readAsDataURL(f);
  });
}
function visitPhotoDel(i,pi){
  const v=S.visits[i]; if(!v.photos) v.photos=visitPhotos(v);
  v.photos.splice(pi,1); v.photo=''; render(); toast('Photo removed.');
}

const LIGHT_TYPES=[['2 feet',18],['4 feet',36]];   // default LED wattage, editable
function addLight(){
  S.lights.push({place:'', type:'4 feet', watt:36, qty:1});
  render();
}
function lightSet(i,f,v){
  const l=S.lights[i]; if(!l) return;
  if(f==='type'){ l.type=v; const d=LIGHT_TYPES.find(t=>t[0]===v); if(d) l.watt=d[1]; }
  else if(f==='watt'||f==='qty') l[f]=N(v);
  else l[f]=v;
  render();
}
function lightDel(i){ S.lights.splice(i,1); render(); }
function lightWatts(l){ return N(l.watt)*N(l.qty); }

/* every electrical consumer in the system */
function loadRows(){
  const rows=[];
  S.units.forEach(u=>{
    const hp = u.hp==='Other' ? N(u.hpCustom) : N(u.hp);
    if(!hp) return;
    rows.push({ grp:(u.service==='FA'?'Fresh Air':'Exhaust')+' — Line '+u.lineNo,
      desc:(u.type==='AHU'?'AHU':'Blower')+' '+hpLabel(u)+' HP'+(u.rpm?', '+u.rpm+' RPM':''),
      qty:N(u.qty)||1, watts: hp*746*(N(u.qty)||1) });
  });
  S.lights.forEach(l=>{
    if(!lightWatts(l)) return;
    rows.push({ grp:'Lighting', desc:'LED tube light '+l.type+(l.place?' — '+l.place:''), qty:N(l.qty), watts:lightWatts(l) });
  });
  return rows;
}
const MCB_SIZES=[6,10,16,20,25,32,40,50,63,80,100,125];
function loadCalc(){
  const rows=loadRows();
  const totalW=rows.reduce((a,r)=>a+r.watts,0);
  const kw=totalW/1000;
  const i3 = totalW ? totalW/(Math.sqrt(3)*415*0.85) : 0;   // 3-phase 415 V, pf 0.85
  const i1 = totalW ? totalW/(240*0.85) : 0;                // single-phase 240 V
  const pick = a => MCB_SIZES.find(m=>m>=a*1.25) || (Math.ceil(a*1.25/25)*25);
  return { rows, totalW, kw, i3, i1, mcb3:pick(i3), mcb1:pick(i1) };
}

function vDuctCalc(){
  return `
  <div class="card" style="overflow:hidden"><h2>GI duct weight calculator <span class="tag">Standalone tool — independent of the quotation</span></h2>
  <div class="body" style="padding:0">
    <iframe title="GI duct weight calculator" src="about:blank"
      onload="if(!this.srcdoc)this.srcdoc=atob(DUCT_CALC_B64)"

  </div></div>`;
}

/* ---------- VIEW: LINES ---------- */
function vLines(){
  const bal = balance();
  return `
  <div class="card"><h2>Air lines</h2><div class="body">
    <div class="grid g2">
      <div><label>Number of exhaust lines</label><input type="number" min="0" max="20" value="${S.lines.exh.length}" onchange="setLines('exh',+this.value)"></div>
      <div><label>Number of fresh air lines</label><input type="number" min="0" max="20" value="${S.lines.fa.length}" onchange="setLines('fa',+this.value)"></div>
    </div>
  </div></div>
  <div class="card"><h2>Line CFM</h2><div class="body">
    ${['exh','fa'].map(t=>{
      const arr=S.lines[t]; if(!arr.length) return '';
      return `<div style="margin-bottom:14px">
        <div style="font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:800;color:${t==='exh'?'var(--flame)':'#2a8fd8'};margin-bottom:8px">${t==='exh'?'Exhaust lines':'Fresh air lines'}</div>
        ${arr.map((l,i)=>`<div class="item ${t==='exh'?'exh':'fa'}"><div class="grid g3">
          <div><label>${t==='exh'?'Exhaust':'Fresh air'} line no.</label><input value="${l.no}" readonly></div>
          <div><label>Serving / area name</label><input value="${esc(l.name||'')}" onchange="S.lines.${t}[${i}].name=this.value;render()" placeholder="e.g. Main cooking range"></div>
          <div><label>CFM of this line</label><input type="number" value="${l.cfm}" onchange="S.lines.${t}[${i}].cfm=+this.value;render()"></div>
        </div></div>`).join('')}
      </div>`;}).join('') || '<div class="warnbar">Add at least one line above.</div>'}
  </div></div>
  <div class="card"><h2>CFM balance check</h2><div class="body"><div class="tblwrap"><table>
    <tr><th>Line</th><th>Required CFM</th><th>Installed CFM</th><th>Deviation</th><th>Status</th></tr>
    ${bal.length?bal.map(b=>`<tr><td><b>${esc(b.label)}</b></td><td class="num">${b.cfm.toLocaleString('en-IN')}</td>
      <td class="num">${b.inst.toLocaleString('en-IN')}</td>
      <td class="num">${b.cfm&&b.inst?(b.dev>0?'+':'')+F2(b.dev)+' %':'—'}</td>
      <td><span class="chip ${b.st}">${b.msg}</span></td></tr>`).join('')
      :'<tr><td colspan="5" style="color:var(--steel-500)">No lines defined.</td></tr>'}
  </table></div></div></div>`;
}
function setLines(t,n){
  n=Math.max(0,Math.min(20,n||0));
  const a=S.lines[t];
  while(a.length<n) a.push({no:a.length+1,cfm:0,name:''});
  while(a.length>n) a.pop();
  reattach();
  render();
}
/* Nothing may point at a line that no longer exists */
function reattach(){
  let moved = 0;
  [...S.units, ...S.ducts].forEach(x=>{
    const arr = x.service==='EXH' ? S.lines.exh : S.lines.fa;
    if(arr.some(l=>l.no==x.lineNo)) return;
    if(arr.length){ x.lineNo = arr[arr.length-1].no; moved++; }
    else {                                    // that service has no lines left — send it to the other side
      const alt = x.service==='EXH' ? S.lines.fa : S.lines.exh;
      if(alt.length){ x.service = x.service==='EXH'?'FA':'EXH'; x.lineNo = alt[0].no; moved++; }
    }
  });
  if(moved) toast(`${moved} item(s) moved to a line that still exists — check tabs 06 and 07.`);
}

/* ============================================================
   MEGAVERKS SECTIONED QUOTATION  (matches Kromangala format)
   Groups existing hoods/units/ducts into:
     EXHAUST AIR SYSTEM  → A Hoods · B Blowers · C Ducting · D Services
     FRESH AIR SYSTEM    → B1 Fresh Air Blowers · C1 Fresh Air Ducting
   Each section carries its own subtotal; then system subtotals; then
   TOTAL → GST → GRAND TOTAL.
   ============================================================ */

/* one normalised row shape everything downstream uses (HTML + Excel) */
function mvRow(sl, cat, spec, L, B, H, unit, qty, rate){
  const q = N(qty), rt = N(rate);
  return { sl, cat, spec, L:L||'', B:B||'', H:H||'', unit:unit||'No', qty:q, rate:rt, amount:q*rt, amount202:q*rt };
}

/* Build the sectioned model from the current quote S. Returns sections with rows + a running subtotal. */
function mvModel(){
  const R = { exhaust:[], fresh:[] };

  // ----- EXHAUST: A. Hoods -----
  const hoodRows = S.hoods.map((h,i)=>{
    const r = mvRow(i+1,
      `${h.type}${h.grade?' — '+h.grade:''}`,
      (h.customSpec||'').trim() || ([hoodDesc(h.type), h.filters, h.remark].filter(Boolean).join(' | ') || 'Kitchen exhaust hood'),
      h.hL ? String(h.hL) : (N(h.rft) ? (Math.round(N(h.rft)*304.8/10)*10).toLocaleString('en-IN') + ' (' + (+F2(h.rft)) + ' Rft)' : ''),
      h.hW ? String(h.hW) : (N(h.rft) ? '1100' : ''),
      h.hH || (N(h.rft) ? '500 / 200' : ''),
      'Rft', N(h.rft), N(h.rate)*(1-N(h.disc)/100));
    r.rate202 = Math.max(0, (h.grade==='SS 202' ? N(h.rate) : N(h.rate)-SS202_LESS)) * (1-N(h.disc)/100);
    r.amount202 = r.qty * r.rate202;
    return r;
  });
  if(hoodRows.length) R.exhaust.push({ code:'A', title:'INSTALLATION OF KITCHEN EXHAUST HOODS', sub:'Installation of Hoods', rows:hoodRows });

  // ----- EXHAUST: B. Blowers (service EXH) -----
  const exhUnits = S.units.filter(u=>u.service==='EXH');
  const bRows = [];
  exhUnits.forEach((u,i)=>{
    const m = blowerLookup(u.hp,u.rpm);
    const typ = (u.model||'').trim() || (u.type==='AHU' ? 'AHU Fan' : (u.rpm<=960?'SISW/DIDW - Direct Driven':'Centrifugal Blower'));
    bRows.push(mvRow(bRows.length+1,
      `Exhaust ${u.type==='AHU'?'AHU Blower':'Centrifugal Blower'} (${typ}) ${N(u.cfm).toLocaleString('en-IN')} CFM - ${hpLabel(u)} HP`,
      (u.customSpec||'').trim() || ([unitTypeDesc(u.model) || (m?String(m.d||'').trim():''), u.remark, m?('MAKE: MEGAVENTS | Motor: '+hpLabel(u)+' HP / '+u.rpm+' rpm'):'MAKE: MEGAVENTS'].filter(Boolean).join(' | ') + ' | Installed at: ' + (u.floor||S.bldg.blowerPlace)),
      '','','','No', N(u.qty), N(u.rate)*(1-N(u.disc)/100)));
  });
  if(bRows.length){
    // anti-vibration mounts line (customary)
    R.exhaust.push({ code:'B', title:'EXHAUST CENTRIFUGAL BLOWERS', sub:'Centrifugal Blower', rows:bRows });
  }

  // ----- EXHAUST: C. Ducting (service EXH) -----
  const exhDucts = S.ducts.filter(d=>d.service==='EXH');
  const cRows = exhDucts.map((d,i)=> mvRow(i+1,
    `GI Rectangular Ducting (Exhaust) — ${d.material} ${d.constr}`,
    (d.customSpec||'').trim() || `GSS rectangular ducting with fittings, flanges, L-angles, suspension | MAKE: Jindal | ${d.gauge} | ${d.w}×${d.h} mm × ${F2(ductRmt(d))} Rmt`,
    d.len?String(d.len):'', d.w?String(d.w):'', d.h?String(d.h):'', 'Sq.Mtr', +F2(ductSqm(d)), N(d.rate)*(1-N(d.disc)/100)));
  if(cRows.length) R.exhaust.push({ code:'C', title:'EXHAUST GI DUCTING, GRILLES & ACCESSORIES', sub:'Ducting & Accessories', rows:cRows });

  // ----- EXHAUST: D. Services (transport/install/others) -----
  const dRows = [];
  if(N(S.extras.transport)) dRows.push(mvRow(dRows.length+1,'Transportation to Site','Loading, unloading, shifting to site','-','-','-','Lot',1,N(S.extras.transport)));
  S.extras.others.forEach(o=>{ if(N(o.amt)) dRows.push(mvRow(dRows.length+1, o.desc||'Other charges','As per scope','-','-','-','Lot',1,N(o.amt))); });
  if(N(S.extras.install)) dRows.push(mvRow(dRows.length+1,'Installation & Commissioning','Testing & commissioning, skilled labour, travel & accommodation','-','-','-','Lot',1,N(S.extras.install)));
  if(dRows.length) R.exhaust.push({ code:'D', title:'TRANSPORTATION, INSTALLATION & MISCELLANEOUS', sub:'Services', rows:dRows });

  // ----- FRESH AIR: B1. Blowers (service FA) -----
  const faUnits = S.units.filter(u=>u.service==='FA');
  const fbRows = [];
  faUnits.forEach((u)=>{
    const m = blowerLookup(u.hp,u.rpm);
    fbRows.push(mvRow(fbRows.length+1,
      `Fresh Air ${u.type==='AHU'?'AHU Fan':'Centrifugal Blower'} (${(u.model||'').trim() || (u.rpm<=960?'Direct Driven':'SISW')}) ${N(u.cfm).toLocaleString('en-IN')} CFM - ${hpLabel(u)} HP`,
      (u.customSpec||'').trim() || ([unitTypeDesc(u.model) || (m?String(m.d||'').trim():''), u.remark,'MAKE: MEGAVERKS | Motor: '+hpLabel(u)+' HP / '+u.rpm+' rpm | FRESH AIR FAN'].filter(Boolean).join(' | ') + ' | Installed at: ' + (u.floor||S.bldg.blowerPlace)),
      '','','','No', N(u.qty), N(u.rate)*(1-N(u.disc)/100)));
    if(N(u.filters&&u.filters.count)) fbRows.push(mvRow(fbRows.length+1,
      'Filter Fixing Hopper with HDPE Filters',
      `${u.filters.micron} microns rating, washable | ${u.filters.count} filters ${u.filters.size||''}`.trim(),
      '','','','Set',1,0));   // priced within blower unless user adds a charge
  });
  if(fbRows.length) R.fresh.push({ code:'B1', title:'FRESH AIR CENTRIFUGAL BLOWERS', sub:'Fresh Air Centrifugal Blowers', rows:fbRows });

  // ----- FRESH AIR: C1. Ducting (service FA) -----
  const faDucts = S.ducts.filter(d=>d.service==='FA');
  const fcRows = faDucts.map((d,i)=> mvRow(i+1,
    `GI Rectangular Ducting (Fresh Air) — ${d.material} ${d.constr}`,
    (d.customSpec||'').trim() || `GSS rectangular ducting with fittings, flanges, L-angles, suspension | MAKE: Jindal | ${d.gauge} | ${d.w}×${d.h} mm × ${F2(ductRmt(d))} Rmt`,
    d.len?String(d.len):'', d.w?String(d.w):'', d.h?String(d.h):'', 'Sq.Mtr', +F2(ductSqm(d)), N(d.rate)*(1-N(d.disc)/100)));
  if(fcRows.length) R.fresh.push({ code:'C1', title:'FRESH AIR GI DUCTING, GRILLES & ACCESSORIES', sub:'Fresh Air Ducting & Accessories', rows:fcRows });

  // ----- ADDITIONAL PRODUCTS -----
  if(S.products && S.products.length){
    const pRows = S.products.map((p,i)=> mvRow(i+1,
      `${p.name||'Product'}${p.model?' — Model '+p.model:''}`,
      (p.customSpec||'').trim() || (p.spec||'As per attached datasheet'),
      '','','', p.unit||'No', N(p.qty), N(p.rate)*(1-N(p.disc)/100)));
    R.exhaust.push({ code:'E', title:'ADDITIONAL EQUIPMENT & PRODUCTS', sub:'Additional Products', rows:pRows });
  }

  // subtotals
  const sub = secs => secs.reduce((s,sec)=>s + sec.rows.reduce((a,r)=>a+r.amount,0), 0);
  R.exhTotal = sub(R.exhaust);
  R.faTotal  = sub(R.fresh);
  R.beforeTax = R.exhTotal + R.faTotal;
  R.gst = Math.round(R.beforeTax * N(S.rates.gst)/100);
  R.grand = R.beforeTax + R.gst;
  const sub202 = secs => secs.reduce((s,sec)=>s + sec.rows.reduce((a,r)=>a+N(r.amount202),0), 0);
  R.exhTotal202 = sub202(R.exhaust);
  R.faTotal202  = sub202(R.fresh);
  R.beforeTax202 = R.exhTotal202 + R.faTotal202;
  R.gst202 = Math.round(R.beforeTax202 * N(S.rates.gst)/100);
  R.grand202 = R.beforeTax202 + R.gst202;
  return R;
}
